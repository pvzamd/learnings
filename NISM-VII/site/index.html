 settlement type and number."}]},{"id":"6.5","title":"Auction of Securities","blocks":[{"type":"p","text":"A seller who fails to deliver is penalised; the shortage value counts as a <b>funds shortage<\/b> if the clearing bank does not confirm it. Shortages arise when a short seller fails to square up, delivery is late, or shares are bad/wrong. The member is debited the undelivered shares' value at a valuation price: the <b>valuation debit<\/b>. To honour the buyer, the CC runs a <b>buy-in auction<\/b> through the exchange on <b>settlement day<\/b> and delivers the shares bought."},{"type":"steps","items":[{"title":"T","text":"Seller sells 100 shares of ABC at ₹500."},{"title":"T+1 pay-in","text":"Nothing delivered; valuation debit at, say, ₹505 = ₹50,500."},{"title":"T+1 afternoon","text":"Auction: a seller offers at ₹510 and is accepted."},{"title":"T+2 (Auction+1)","text":"Auction shares delivered to the buyer; the defaulter bears the cost."}]}]},{"id":"6.5.1","title":"Auction on Exchanges / Clearing Corporations","blocks":[{"type":"p","text":"An <b>auction tender notice<\/b> gives: (a) scrips short, (b) quantity for auction, (c) date and time of the auction."},{"type":"table","head":["Rule","Detail"],"rows":[["When","Settlement day, after pay-out: <b>BSE 2:00 pm to 2:45 pm<\/b>; <b>NSE 2:30 pm onwards<\/b>"],["Excluded","Scrips for direct close-out (e.g. trade-for-trade) and securities under corporate action"],["How often","<b>Only once<\/b>, unless a special resolution of the CC's governing board approves"],["Time limit","Never beyond <b>one week<\/b> from the settlement's pay-in day"],["Auction seller","Gets pay-in obligation the same day; delivers by <b>Auction + 1 day<\/b>"],["Auction funds payer","Clear funds within the CC's time on settlement day"],["Auction pay-out","Shares and funds on <b>Auction + 1 day<\/b>"]]}]},{"id":"6.5.1.1","title":"Self Auction / Internal Shortages","blocks":[{"type":"p","text":"If one client of a broker fails to deliver while another client bought the same quantity, netting leaves the broker with no CC obligation, yet the buyer gets nothing: an <b>internal shortage<\/b>."},{"type":"list","items":["Members report internal shortages on <b>pay-in day<\/b> for a <b>self-auction<\/b>; the CC clubs them with normal shortages in one auction.","With direct pay-out, SEBI asked TMs/CMs to use the CC auction for such shortages and charge clients <b>nothing beyond CC charges<\/b>.","If the CC cannot get the shares, the member closes out per CC guidelines.","CCs may charge fees and <b>may not give settlement guarantee<\/b> for these auctions."]},{"type":"example","title":"Internal shortage","text":"Client A sells and client B buys 50 shares of X through broker K, so K's net obligation is nil. A fails to deliver; K reports 50 shares for self-auction on pay-in day."}]},{"id":"6.5.2","title":"Close-Out Procedure","blocks":[{"type":"p","text":"If the auction finds no sellers, the CC <b>closes out<\/b>: the defaulter is charged a close-out price and the buyer is compensated in money. Some shortages go straight to close-out."},{"type":"table","head":["Situation","Close-out price (whichever is higher)"],"rows":[["No sellers in auction (normal)","Highest price across exchanges from trade day till auction day, OR <b>20%<\/b> above official closing (settlement) price on auction day"],["Corporate action: cum-basis shortage whose auction pay-out cannot happen by Record Date/Book Closure minus 1 business day","Highest price across exchanges from trade day till auction day, OR <b>10%<\/b> above settlement price on auction day (or as declared)"],["Block deal window and trade-for-trade (direct)","Highest price across exchanges on T day (till settlement minus 1 day), OR <b>20%<\/b> above settlement price on T day"],["Optional T+0 (no auction)","<b>10% above<\/b> the day's highest price across all exchanges"],["Auction seller fails on auction pay-in day","Highest price from original trade day till auction day, OR <b>20%<\/b> above closing price on close-out day; charged to the auction seller"]]},{"type":"p","text":"For corporate actions, cum-basis shortages <b>go to auction only if auction pay-out is on or before Record Date/Book Closure minus 1 business day<\/b>; otherwise they are closed out directly."},{"type":"example","title":"Close-out","text":"100 shares undelivered, no auction offers. Highest price, trade day to auction day: ₹540. Auction-day close ₹480, plus 20% = ₹576. Higher is ₹576: seller charged ₹57,600."},{"type":"key","text":"Proceeds settle the aggrieved party's claim; any balance goes to the <b>Core Settlement Guarantee Fund (Core SGF)<\/b>, not to the defaulter."},{"type":"trap","text":"20% is the normal mark-up; 10% is for corporate-action cum shortages and T+0 (in T+0, 10% above the day's <b>highest<\/b> price)."}]},{"id":"6.6","title":"Settlement of Equity Derivatives","blocks":[{"type":"p","text":"Since <b>October 2019<\/b>, stock futures and options open at expiry are <b>physically settled<\/b>; index F&O remain <b>cash-settled<\/b>."},{"type":"p","text":"<b>Futures<\/b> settle (A) daily by <b>mark-to-market (MTM)<\/b>: the loser's CM pays, the gainer's CM receives, and positions are reset to the daily settlement price; MTM is always <b>cash<\/b>. CMs collect/settle MTM for their TMs and clients. (B) <b>Final settlement<\/b> happens on the last trading day."},{"type":"table","head":["Date","Previous price (₹)","Settlement price (₹)","Change","MTM (x 200)"],"rows":[["21st","2,502.00 (buy)","2,508.00","+6","+1,200"],["22nd","2,508.00","2,532.00","+24","+4,800"],["23rd","2,532.00","2,548.00","+16","+3,200"],["24th","2,548.00","2,510.00","-38","-7,600"],["27th","2,510.00","2,532.00","+22","+4,400"],["28th","2,532.00","2,520.00","-12","-2,400"],["29th (expiry)","2,520.00","2,545.00 (final)","+25","+5,000"],["Net","","","+43","+₹8,600"]],"caption":"Workbook example: XYZ index futures, 1 contract = 200 units"},{"type":"hook","text":"Shortcut: (final price - buy price) x quantity = (2,545 - 2,502) x 200 = ₹8,600. Daily MTM pays it in instalments."},{"type":"compare","items":[{"title":"Cash-settled futures (final)","points":["All positions marked to the <b>final settlement price<\/b> on expiry","Funds pay-in by declared time; pay-out after"]},{"title":"Physically settled futures (final)","points":["Delivery on <b>T+1<\/b> (T = expiry) at the <b>futures final settlement price<\/b>","Gap between previous settlement/trade price and final price is cash-settled with daily MTM on T+1"]}]},{"type":"p","text":"<b>Options:<\/b> (A) <b>daily premium<\/b>: buyer pays, seller receives, netted per client per contract. (B) <b>Final exercise<\/b>: all <b>ITM stock options are auto-exercised<\/b> on expiry. <b>Index options are European<\/b> (exercise on expiry only); ITM longs are <b>randomly assigned<\/b> to shorts of the same series. Final settlement price = underlying's closing price on expiry."},{"type":"key","text":"Exercise value per unit: <b>Call = closing price - strike<\/b>; <b>Put = strike - closing price<\/b>."},{"type":"table","head":["Physically settled stock option","Results in"],"rows":[["Long call exercised","<b>Buy<\/b>: receive shares"],["Short call assigned","<b>Sell<\/b>: deliver shares"],["Long put exercised","<b>Sell<\/b>: deliver shares"],["Short put assigned","<b>Buy<\/b>: receive shares"]],"caption":"Obligation valued at the option's <b>strike price<\/b>"},{"type":"example","title":"Two expiries","text":"Index put, strike ₹22,000, index closes ₹21,700, 75 units: long gets 300 x 75 = ₹22,500 cash.<br>Stock call, strike ₹1,400, stock closes ₹1,450, lot 500: long receives 500 shares and pays ₹7,00,000 (strike x 500)."},{"type":"hook","text":"Long call = you call the shares in (buy). Long put = you put them out (sell). Shorts do the opposite."}]},{"id":"6.6.1","title":"Settlement Price for Derivatives","blocks":[{"type":"p","text":"<b>Daily settlement price:<\/b> the contract's closing price (on an exchange or across exchanges); for illiquid contracts, a theoretical price per SEBI guidelines."},{"type":"table","head":["Product","Final settlement price"],"rows":[["Index futures/options","Closing price of the underlying <b>index<\/b> on the last trading day, on the given exchange"],["Stock futures/options","Closing price of the stock in the CM segment <b>across exchanges<\/b> on the last trading day"],["Currency futures/options","<b>FBIL reference rate<\/b> or a rate derived from it"],["Cash-settled GOI bond futures/options","Weighted average price in the <b>last two hours<\/b> on <b>NDS-OM<\/b> (RBI's G-sec trading screen), minimum <b>5 trades<\/b>; else FIMMDA/FBIL price"]]}]},{"id":"6.6.2","title":"Derivatives Funds and Securities Settlement","blocks":[{"type":"p","text":"<b>Funds (6.6.2):<\/b> MTM, cash-settled futures final settlement, premium and cash-settled exercise obligations are <b>netted at CM level<\/b>; pay-in before market hours next day, pay-out credited after, as in the cash market."},{"type":"p","text":"<b>Securities (6.6.3):<\/b> a CM's deliverable/receivable positions are netted across all its clients/TMs. On stock derivative expiry, cash and physical F&O obligations are <b>settled net<\/b> (Box 5.1) in the <b>CM segment's<\/b> settlement type and number."}]},{"id":"6.7.1","title":"Corporate Actions: Record Date and Ex-Date","blocks":[{"type":"p","text":"Corporate actions (rights, bonus, split, dividend) go to those holding shares on the <b>record date<\/b>. A stock trades <b>cum-benefit up to 1 trading day before the record date<\/b>; the day it trades without the benefit is the <b>ex-date<\/b>, from which exchanges adjust the base price."},{"type":"table","head":["Item","XYZ Ltd, bonus 1:1"],"rows":[["Record date","May 28, 2025 (holders in demat at EOD)"],["Ex-date","May 28, 2025"],["Close on May 27, 2025","₹500"],["Adjusted base price, May 28, 2025","₹250"]]},{"type":"example","title":"Who gets the bonus?","text":"Bought May 27: shares arrive May 28 (T+1) before EOD, so <b>eligible<\/b>. Bought May 28: shares arrive May 29, <b>not eligible<\/b>."},{"type":"key","text":"Under T+1, <b>ex-date = record date<\/b>. Record date December 22 means ex-date December 22."}]},{"id":"6.7.2","title":"Corporate Actions to be Adjusted, Timing and What Changes","blocks":[{"type":"p","text":"Bonus, rights, extraordinary dividends, mergers/demergers, amalgamation, splits and consolidations alter F&O contracts. <b>Principle:<\/b> keep the <b>value of positions the same<\/b> on cum and ex dates as far as possible, preserving ITM/ATM/OTM status and smooth exercise/assignment."},{"type":"compare","items":[{"title":"Stock benefits","points":["Bonus, Rights","Merger/De-merger, Amalgamation","Splits, Consolidations","Hive-off","Warrants, Secured Premium Notes (SPNs)"]},{"title":"Cash benefit","points":["Cash dividend"]}]},{"type":"key","text":"<b>When (6.7.3):<\/b> on the <b>last cum day<\/b>, after trading closes. <b>What (6.7.4):<\/b> strike price, position, market lot/multiplier, on <b>all open positions<\/b>. Expiry may also change: contracts force-closed and replaced by adjusted ones."}]},{"id":"6.7.5.1","title":"Bonus, Stock Splits and Consolidations","blocks":[{"type":"table","head":["Item","Bonus / split / consolidation"],"rows":[["Adjustment factor (AF)","Bonus A:B: <b>(A+B)/B<\/b>. Split or consolidation A:B: <b>A/B<\/b>"],["New strike","Old strike <b>÷<\/b> AF"],["New market lot","Old lot <b>x<\/b> AF"],["New position","Old position <b>x<\/b> AF"]]},{"type":"example","title":"Bonus 1:1","text":"AF = 2. Strike ₹500 becomes ₹250; lot 1,000 becomes 2,000; a 2,000-share position becomes 4,000. Value stays ₹10,00,000."},{"type":"example","title":"Split and consolidation","text":"Split 5:1 (one ₹10 share into five ₹2 shares): AF = 5. Strike ₹2,000 becomes ₹400; lot 250 becomes 1,250.<br>Consolidation 1:10: AF = 0.1. Strike ₹20 becomes ₹200; lot 10,000 becomes 1,000."},{"type":"hook","text":"More, cheaper shares: bonus and split <b>divide<\/b> the strike and <b>multiply<\/b> lot and position."}]},{"id":"6.7.5.2","title":"Rights Issue and Fractions","blocks":[{"type":"p","text":"Rights work the other way: strike <b>x<\/b> AF; lot and position <b>÷<\/b> AF. With A = rights entitlement, B = existing shares, P = close on last cum date, S = issue price: benefit per entitlement = (P - S) x A; benefit per share <b>E = (P - S) x A / (A + B)<\/b>; <b>AF = (P - E) / P<\/b>. Any dividend declared with the rights follows the dividend policy."},{"type":"example","title":"Rights 1:4","text":"P = ₹200, S = ₹100: E = 100 x 1/5 = ₹20; AF = 180/200 = 0.9. Strike ₹220 becomes ₹198; lot 900 becomes 1,000. Value unchanged at ₹1,98,000."},{"type":"p","text":"<b>Fractions<\/b> (e.g. bonus 3:7): (1) value the position before; (2) value with the exact AF; (3) round strike to nearest tick, lot to nearest integer; (4) revalue. The relevant authority covers the gap between 1 and 4 by adjusting strike or lot, <b>without forced closure<\/b>."},{"type":"example","title":"Bonus 3:7","text":"AF = 10/7. Strike ₹1,000 becomes ₹700; lot 400 becomes 571.43, rounded to 571. Value ₹4,00,000 before, ₹3,99,700 after rounding: the ₹300 gap is fixed by tweaking strike or lot."}]},{"id":"6.7.5.3","title":"Dividends","blocks":[{"type":"table","head":["Dividend","F&O adjustment"],"rows":[["Below 2% of market value (ordinary)","None"],["At or above 2% (extraordinary), or any dividend where the company sought exemption from SEBI LODR (2015) timelines","Adjusted"]]},{"type":"list","items":["<b>Market price for the 2% test:<\/b> close on the day <b>before<\/b> the board announces; if announced <b>after market hours<\/b>, that <b>same day's<\/b> close. If the AGM changes the rate: the post-AGM rate and the close on the day before the AGM.","Extraordinary: the <b>total dividend<\/b> (special and/or ordinary) is <b>reduced from all option strikes<\/b> from the ex-dividend date; futures carry forward at daily settlement price <b>less<\/b> the dividend."]},{"type":"example","title":"2% test","text":"Close ₹1,000 the day before the board meeting. Dividend ₹15 (1.5%): no change. Dividend ₹25 (2.5%): a ₹1,000 call becomes a ₹975 call; futures carry forward at settlement price minus ₹25."}]},{"id":"6.7.5.4","title":"Mergers and Demergers","blocks":[{"type":"list","items":["<b>Merger:<\/b> when the record date is announced, members are told the expiry (<b>last cum-date<\/b>); no fresh contracts on a stock that will cease to exist; unexpired contracts are compulsorily settled at the <b>underlying's close on the last cum-date<\/b>."]},{"type":"p","text":"<b>Demerger:<\/b> derivatives can be re-introduced on the post-restructured company from its first listing day only if <b>all<\/b> hold: (a) F&O on the original company traded before restructuring; (b) its market cap was at least <b>₹1,000 crore<\/b>; (c) the new company is likely to be at least <b>one-third<\/b> its size by revenue, assets or analyst valuation; (d) nothing (e.g. extremely low free float) makes it ineligible."},{"type":"key","text":"If met: existing contracts expire on the <b>last cum date<\/b>; <b>near, middle and far month<\/b> contracts on the restructured company start from the demerger <b>ex-date<\/b>."}]},{"id":"6.7.5.5","title":"Other Corporate Actions","blocks":[{"type":"p","text":"Other corporate actions are adjusted case by case by the relevant authority on the same principles, including compulsory close-out where needed."}]}],"numbers":[{"fact":"Cash market settlement cycle","value":"T+1 rolling (optional beta T+0 alongside)","ref":"6.1"},{"fact":"Days excluded when counting the settlement day","value":"Bank holidays, exchange/CC holidays, Saturdays, Sundays","ref":"6.1"},{"fact":"Derivatives daily and final settlement","value":"T+1 working day","ref":"6.1"},{"fact":"Currency derivatives final settlement","value":"T+2 (expiry + 2 days)","ref":"6.1"},{"fact":"Derivatives funds pay-in/pay-out (MTM, premium, cash-settled final)","value":"Before market opens next day, around 8:30 am","ref":"6.1"},{"fact":"Custodial confirmation","value":"T+1 by 7:30 am","ref":"6.1"},{"fact":"Obligation download by CC","value":"T+1 by 9:00 am","ref":"6.1"},{"fact":"Pay-in of securities and funds","value":"T+1 up to 11:00 am","ref":"6.1"},{"fact":"Pay-out of funds","value":"T+1, 1:30 pm","ref":"6.1"},{"fact":"Pay-out of securities (direct to client)","value":"T+1 by 3:30 pm (revised from 1:30 pm)","ref":"6.1"},{"fact":"Direct pay-out of securities circular","value":"SEBI, June 5, 2024","ref":"6.1"},{"fact":"Auction pay-in for T-day shortages","value":"T+2, generally by 8:00 am, then pay-out","ref":"6.1"},{"fact":"Inter-depository transfers when settlements bunch after holidays","value":"Within 1 hour, before next pay-in","ref":"6.1.1"},{"fact":"Current closing price method","value":"VWAP of last 30 minutes of the continuous trading session","ref":"6.2.1"},{"fact":"Closing Auction Session (CAS) circular","value":"SEBI, January 16, 2026","ref":"6.2.1"},{"fact":"CAS timing","value":"3:15 pm to 3:35 pm (20 minutes)","ref":"6.2.1"},{"fact":"CAS sub-sessions","value":"4, of 5 minutes each","ref":"6.2.1"},{"fact":"CAS: reference price / transition from CTS","value":"3:15 pm","ref":"6.2.1"},{"fact":"CAS: order entry, limit and market orders","value":"3:20 pm","ref":"6.2.1"},{"fact":"CAS: limit orders only, random close","value":"3:25 pm; random close in last 2 minutes","ref":"6.2.1"},{"fact":"CAS: order matching","value":"3:30 pm","ref":"6.2.1"},{"fact":"CAS applies first to","value":"Stocks on which derivatives are available","ref":"6.2.1"},{"fact":"Uses of the closing price listed","value":"7","ref":"6.2.1"},{"fact":"Client nodal accounts (USCNBA/DSCNBA) circular","value":"SEBI, December 13, 2023","ref":"6.3.1"},{"fact":"Running account for securities discontinued","value":"SEBI circular, June 20, 2019","ref":"6.3.1"},{"fact":"Settlement of client funds without running account","value":"Within 24 hours / 1 working day of pay-out","ref":"6.3.1"},{"fact":"Running account settlement frequency","value":"At least once in 30 days (monthly) or 90 days (quarterly)","ref":"6.3.1"},{"fact":"Running account settlement dates","value":"First Friday and/or Saturday of month/quarter","ref":"6.3.1"},{"fact":"Annual running-account calendar issued","value":"By exchanges jointly, at the start of the financial year","ref":"6.3.1"},{"fact":"Running account dispute window","value":"30 working days from the statement date","ref":"6.3.1"},{"fact":"Return of client funds/securities on request (with broker)","value":"Within 1 working day","ref":"6.3.1"},{"fact":"Return of client funds/securities on request (with CM/CC)","value":"Within 3 working days","ref":"6.3.1"},{"fact":"Inactive client credit balance trigger","value":"No trade for 30 calendar days","ref":"6.3.1"},{"fact":"UPI ID mechanism for intermediaries","value":"SEBI circular, June 2025","ref":"6.3.1"},{"fact":"Penal interest on funds pay-in shortage","value":"Not less than 0.07% per day","ref":"6.3.4"},{"fact":"Demat account categories allowed for brokers","value":"6","ref":"6.4.1"},{"fact":"Physical F&O netted with cash segment","value":"SEBI circular, November 30, 2022","ref":"6.4.1"},{"fact":"Auction session at BSE","value":"2:00 pm to 2:45 pm on settlement day","ref":"6.5.1"},{"fact":"Auction session at NSE","value":"2:30 pm onwards on settlement day","ref":"6.5.1"},{"fact":"Maximum number of auctions","value":"Once (more only by special resolution of the CC's governing board)","ref":"6.5.1"},{"fact":"Auction deadline","value":"Not beyond one week from pay-in day","ref":"6.5.1"},{"fact":"Auction pay-in and pay-out","value":"Auction + 1 day","ref":"6.5.1"},{"fact":"Normal close-out price","value":"Higher of highest price (trade day to auction day) or 20% above closing price on auction day","ref":"6.5.2"},{"fact":"Corporate action cum shortage close-out","value":"Higher of highest price or 10% above settlement price on auction day","ref":"6.5.2"},{"fact":"Corporate action cum shortage goes to auction only if","value":"Auction pay-out is on or before Record Date/Book Closure minus 1 business day","ref":"6.5.2"},{"fact":"Block window / trade-for-trade close-out","value":"Higher of highest price on T day or 20% above settlement price on T day","ref":"6.5.2"},{"fact":"T+0 shortage close-out","value":"10% above the day's highest price across exchanges","ref":"6.5.2"},{"fact":"Auction seller default close-out","value":"Higher of highest price or 20% above closing price on close-out day","ref":"6.5.2"},{"fact":"Surplus from auction/close-out","value":"Credited to Core SGF","ref":"6.5.2"},{"fact":"Stock F&O physically settled since","value":"October 2019","ref":"6.6"},{"fact":"MTM example net gain","value":"₹8,600 (43 points x 200)","ref":"6.6"},{"fact":"Physically settled futures final settlement","value":"T+1 after expiry, at futures final settlement price","ref":"6.6"},{"fact":"Physically settled options obligation value","value":"At strike price","ref":"6.6"},{"fact":"GOI bond futures final settlement price","value":"Weighted average price, last 2 hours on NDS-OM, minimum 5 trades","ref":"6.6.1"},{"fact":"Currency F&O final settlement price","value":"FBIL reference rate (or derived from it)","ref":"6.6.1"},{"fact":"Cum-benefit trading lasts until","value":"1 trading day before record date (so ex-date = record date under T+1)","ref":"6.7.1"},{"fact":"Bonus example: XYZ Ltd 1:1","value":"Close ₹500 on May 27, 2025; adjusted base price ₹250 on May 28, 2025","ref":"6.7.1"},{"fact":"Stock benefits listed","value":"9 (bonus, rights, merger/demerger, amalgamation, splits, consolidations, hive-off, warrants, SPNs)","ref":"6.7.2"},{"fact":"Adjustment factor: bonus A:B","value":"(A+B)/B","ref":"6.7.5.1"},{"fact":"Adjustment factor: split/consolidation A:B","value":"A/B","ref":"6.7.5.1"},{"fact":"Adjustment factor: rights","value":"(P-E)/P, where E = (P-S) x A/(A+B)","ref":"6.7.5.2"},{"fact":"Extraordinary dividend threshold","value":"2% or more of market value","ref":"6.7.5.3"},{"fact":"LODR regulations referred for dividend exemption","value":"SEBI (LODR) Regulations, 2015","ref":"6.7.5.3"},{"fact":"Demerger: minimum market cap of pre-restructured company","value":"₹1,000 crore","ref":"6.7.5.4"},{"fact":"Demerger: minimum size of post-restructured company","value":"One-third of pre-restructured company","ref":"6.7.5.4"}],"flashcards":[{"q":"What is a settlement cycle?","a":"The period within which settlement is made; for cash equities it is T+1, excluding holidays and weekends."},{"q":"Cash settlement vs physical settlement of derivatives?","a":"Cash: only the price difference is paid. Physical: the underlying security is delivered."},{"q":"Which equity derivatives are cash-settled and which physical?","a":"Index F&O: cash. Stock F&O: physical (since October 2019)."},{"q":"When is the final settlement of currency derivatives?","a":"T+2 (expiry + 2 days); other derivatives settle on T+1."},{"q":"When is securities pay-out under direct pay-out?","a":"By 3:30 pm on T+1, straight into the client's demat account."},{"q":"Holiday settlement rule?","a":"Sequential: first settlement's pay-in and pay-out complete before the next; inter-depository transfers within one hour."},{"q":"Gross (trade-to-trade) obligation for securities?","a":"Pay-in = cumulative sell quantity; pay-out = cumulative buy quantity; no netting."},{"q":"How is the closing price computed today?","a":"VWAP of trades in the last 30 minutes of the continuous trading session."},{"q":"What is CAS and its timing?","a":"Closing Auction Session (SEBI, Jan 16, 2026): 3:15 pm to 3:35 pm, four 5-minute sub-sessions."},{"q":"Which stocks get CAS first?","a":"Stocks on which derivative contracts are available."},{"q":"When is the random close in CAS?","a":"In the last 2 minutes of the 3:25 pm sub-session (limit orders only)."},{"q":"Name four uses of the closing price.","a":"Next day's base price, end-of-day index value, derivatives settlement, MTM margin (also MF NAV, post-close, block window)."},{"q":"USCNBA vs DSCNBA?","a":"USCNBA receives client funds; DSCNBA is the only account for paying clients."},{"q":"Can a broker accept cash from a client?","a":"No. Only account payee cheques, DDs, NEFT/direct credit or other RBI-approved modes."},{"q":"Who may sign a running account authorisation?","a":"Only the client; not an Authorised Person or PoA holder."},{"q":"Running account settlement dates?","a":"First Friday and/or Saturday of the month or quarter, per the exchanges' annual calendar."},{"q":"Dispute window for running account statements?","a":"30 working days from the statement date."},{"q":"Inactive client rule?","a":"No trade for 30 calendar days: full credit balance returned on the next monthly settlement date."},{"q":"Penal interest on funds shortage?","a":"Not less than 0.07% per day."},{"q":"What is a valuation debit?","a":"Debit to a member for undelivered securities, valued at the valuation price."},{"q":"Auction timing on NSE and BSE?","a":"Settlement day after pay-out: NSE 2:30 pm onwards; BSE 2:00 to 2:45 pm."},{"q":"Auction pay-in and pay-out day?","a":"Auction + 1 day."},{"q":"What is an internal shortage?","a":"A client fails to deliver but the broker's net obligation was nil because another client bought; handled by self-auction."},{"q":"Normal close-out price?","a":"Higher of highest price from trade day to auction day, or 20% above closing price on auction day."},{"q":"Where does surplus from auction/close-out go?","a":"To the Core Settlement Guarantee Fund, not the defaulter."},{"q":"Exercise value of a call and a put?","a":"Call = closing price - strike; Put = strike - closing price."},{"q":"Long put exercised in a physically settled stock option results in?","a":"A sell position: deliver shares, valued at strike price."},{"q":"Final settlement price for stock F&O?","a":"Closing price of the stock in the CM segment across exchanges on the last trading day."},{"q":"Exercise style of index options in India?","a":"European: exercised only on expiry day; ITM longs randomly assigned to shorts of the same series."},{"q":"Under T+1, how do ex-date and record date relate?","a":"They are the same day."},{"q":"When are corporate action adjustments made in F&O?","a":"On the last cum day, after close of trading, on all open positions."},{"q":"Bonus A:B adjustment factor and effect?","a":"(A+B)/B; strike divided by it, lot and position multiplied by it."},{"q":"Rights adjustment factor?","a":"(P-E)/P with E = (P-S)A/(A+B); strike multiplied, lot and position divided."},{"q":"When is a dividend extraordinary for F&O?","a":"At or above 2% of market value (or LODR timeline exemption sought)."},{"q":"Demerger: two size tests for re-introducing derivatives?","a":"Pre-restructured market cap at least ₹1,000 crore; new company at least one-third its size."}],"questions":[{"q":"After receiving intimation from his broker that his sale has been executed, what kind of instruction should the client give to his DP?","options":["Credit instruction","Debit (delivery) instruction","Hold instruction","No instruction is needed"],"answer":1,"why":"The seller issues a delivery instruction slip, i.e. a debit instruction, to move shares from his demat account to the broker's pool account.","ref":"6.4","level":"easy"},{"q":"Corporate action adjustments in equity F&O are carried out on all ........ positions.","options":["Closed","Past","Open","Executed"],"answer":2,"why":"Adjustments for corporate actions are made on all open positions.","ref":"6.7.2","level":"easy"},{"q":"What does the clearing corporation do when a broker fails to deliver securities?","options":["Sells the securities","Cancels the trade","Levies only a penalty","Conducts a buy-in auction"],"answer":3,"why":"For delivery shortages the CC conducts a buy-in auction to buy shares from the market for the buying broker.","ref":"6.5","level":"easy"},{"q":"When a company declares an extraordinary dividend, the total dividend amount is ........ all strike prices of option contracts on that stock.","options":["Reduced from","Added to","Not applied to","Multiplied with"],"answer":0,"why":"For extraordinary dividends the total dividend is reduced from all strike prices from the ex-dividend date.","ref":"6.7.5.3","level":"easy"},{"q":"For computing the end-of-day index value, which price of the constituent shares is used?","options":["Last traded price","Closing price","Base price","Opening price"],"answer":1,"why":"The closing price is the basis for computing the end-of-day index value.","ref":"6.2.1","level":"easy"},{"q":"Brokers must not accept ........ from clients, whether against obligations or as margin.","options":["Demand drafts","Account payee crossed cheques","Cash","NEFT transfers"],"answer":2,"why":"Cash is prohibited; payments must be by account payee cheque, DD, direct credit or other RBI-approved modes.","ref":"6.3.1","level":"easy"},{"q":"If a company's record date is December 22, 202X, what is the ex-date in the equity segment under T+1 settlement?","options":["December 21, 202X","December 22, 202X","December 23, 202X","December 20, 202X"],"answer":1,"why":"Under T+1 a stock trades cum-benefit until 1 trading day before the record date, so the ex-date is the record date itself.","ref":"6.7.1","level":"medium"},{"q":"Final settlement of currency derivatives takes place on expiry plus how many days?","options":["0","1","2","3"],"answer":2,"why":"Currency derivatives' final settlement is on T+2; other derivatives settle on T+1.","ref":"6.1","level":"easy"},{"q":"How is the closing price of a stock in the equity cash segment currently determined?","options":["Last traded price at 3:30 pm","VWAP of trades in the last 30 minutes of the continuous trading session","Simple average of the last 30 trades","VWAP of the whole trading day"],"answer":1,"why":"Currently the closing price is the VWAP of trades in the last thirty minutes of the CTS.","ref":"6.2.1","level":"medium"},{"q":"Under SEBI's January 16, 2026 circular, the Closing Auction Session (CAS) runs:","options":["3:30 pm to 3:50 pm","3:00 pm to 3:20 pm","3:15 pm to 3:35 pm","3:40 pm to 4:00 pm"],"answer":2,"why":"CAS is a separate 20-minute session from 3:15 pm to 3:35 pm on all trading days.","ref":"6.2.1","level":"easy"},{"q":"In the Closing Auction Session, the random close happens:","options":["During reference price calculation at 3:15 pm","During order entry for both limit and market orders at 3:20 pm","During order matching at 3:30 pm","In the last 2 minutes of the order-entry period starting 3:25 pm"],"answer":3,"why":"The third sub-session (3:25 pm) allows limit orders only and ends with a random close in the last 2 minutes.","ref":"6.2.1","level":"medium"},{"q":"In the initial phase, the closing price of which stocks will be determined through the Closing Auction Session?","options":["All listed stocks","Stocks on which derivative contracts are available","Only Nifty 50 stocks","Stocks eligible for T+0 settlement"],"answer":1,"why":"CAS is phased in, starting with cash segment stocks on which derivative contracts are available.","ref":"6.2.1","level":"medium"},{"q":"What is permitted in the CAS sub-session starting at 3:25 pm?","options":["Order entry for limit orders; market orders cannot be modified or cancelled","Entry of both limit and market orders","Only order matching","Only reference price calculation"],"answer":0,"why":"From 3:25 pm only limit orders can be entered, market orders cannot be modified/cancelled, and the session closes randomly in the last 2 minutes.","ref":"6.2.1","level":"medium"},{"q":"Which of the following is NOT listed in the workbook as a use of the closing price?","options":["Next day's base price","Computation of mark-to-market margin","Computation of mutual fund NAV","Fixing the issue price in an IPO"],"answer":3,"why":"The closing price feeds the post-close session, base price, block window, index value, derivatives settlement, MTM and MF NAV, not IPO pricing.","ref":"6.2.1","level":"medium"},{"q":"When several settlements fall due together after holidays, depositories must complete inter-depository transfers:","options":["Within 30 minutes","Within one hour and before the next settlement's pay-in begins","By end of day","Within two hours of pay-out"],"answer":1,"why":"Depositories must facilitate inter-depository transfers within one hour and before pay-in for the subsequent settlement.","ref":"6.1.1","level":"medium"},{"q":"Under trade-to-trade (gross) settlement, a member's securities pay-in obligation equals:","options":["Net sell quantity","Cumulative buy quantity","Cumulative sell quantity","Zero"],"answer":2,"why":"With no netting, securities pay-in equals the cumulative sell quantity and pay-out the cumulative buy quantity.","ref":"6.2","level":"medium"},{"q":"The penal interest an exchange/CC may levy on a member's funds pay-in shortage is:","options":["Not less than 0.07% per day","Not less than 0.7% per day","1% per month","0.07% per month"],"answer":0,"why":"Penal interest of not less than 0.07 percent per day may be levied on the pay-in shortage.","ref":"6.3.4","level":"medium"},{"q":"Within how many days must a client raise a dispute about a running account statement?","options":["7 days","15 days","30 working days","90 days"],"answer":2,"why":"Disputes must be brought to the broker's notice within 30 working days from the statement date.","ref":"6.3.1","level":"medium"},{"q":"A client who opted for quarterly running account settlement has a credit balance and has not traded for 30 calendar days. The broker must:","options":["Wait for the next quarterly settlement","Return the entire credit balance on the upcoming monthly settlement date","Return it within 24 hours","Transfer it to the Investor Protection Fund"],"answer":1,"why":"Inactive clients' balances are returned on the next monthly settlement date irrespective of their preferred cycle.","ref":"6.3.1","level":"hard"},{"q":"A client asks for funds lying with the clearing member/clearing corporation. Within how long must the stock broker transfer them?","options":["1 working day","7 working days","3 working days","30 days"],"answer":2,"why":"Within 1 working day if lying with the broker; within 3 working days if lying with the CM/CC.","ref":"6.3.1","level":"medium"},{"q":"A running account authorisation may be signed by:","options":["The Authorised Person of the broker","A Power of Attorney holder","The client only","The broker's compliance officer"],"answer":2,"why":"The authorisation must be signed by the client only, not by an AP or PoA holder, and must be dated and revocable.","ref":"6.3.1","level":"medium"},{"q":"How many categories of demat accounts are stock brokers permitted to maintain as specified by SEBI?","options":["4","5","8","6"],"answer":3,"why":"Proprietary, pool, client unpaid securities pledgee, client securities margin pledge, client securities under funding, and client nodal MFOS: six.","ref":"6.4.1","level":"medium"},{"q":"On NSE, the auction for undelivered quantities is conducted on settlement day:","options":["2:00 pm to 2:45 pm","2:30 pm onwards","9:15 am to 10:00 am","After 3:30 pm"],"answer":1,"why":"NSE auctions run from 2:30 pm onwards after pay-out; BSE's window is 2:00 pm to 2:45 pm.","ref":"6.5.1","level":"medium"},{"q":"An auction for a shortage can in no case be held beyond:","options":["One week from the pay-in day of the settlement","Three days from the trade date","15 days from pay-out","One month from the trade date"],"answer":0,"why":"No auction may be held beyond one week from the pay-in day of the relevant settlement.","ref":"6.5.1","level":"medium"},{"q":"If no sellers come forward in the auction, the shortage is closed out at:","options":["The auction day's closing price","10% above the trade price","The valuation price","The higher of the highest price from trade day till auction day, or 20% above the official closing price on auction day"],"answer":3,"why":"Normal close-out uses the higher of the highest price across exchanges till auction day or 20% above the auction-day closing price.","ref":"6.5.2","level":"medium"},{"q":"Shortages in block deal window and trade-for-trade trades are directly closed out at the higher of the highest price on T day or:","options":["20% above the settlement price on T day","10% above the settlement price on T day","5% above the closing price","The auction price"],"answer":0,"why":"Block window and TFT shortages go straight to close-out at the higher of the T-day highest price or 20% above the T-day settlement price.","ref":"6.5.2","level":"hard"},{"q":"A seller fails to deliver 100 shares; the auction draws no offers. The highest price from trade day to auction day is ₹540 and the closing price on auction day is ₹480. What is the close-out amount?","options":["₹48,000","₹54,000","₹57,600","₹52,800"],"answer":2,"why":"20% above ₹480 is ₹576, which is higher than ₹540, so 100 x ₹576 = ₹57,600.","ref":"6.5.2","level":"hard"},{"q":"Any amount left over from auction or close-out proceeds after settling the aggrieved party's claim is credited to:","options":["The defaulting member","The buying client","The Investor Protection Fund","The Core Settlement Guarantee Fund"],"answer":3,"why":"The balance goes to the Core SGF instead of the defaulting party's account.","ref":"6.5.2","level":"medium"},{"q":"An investor buys one lot (200 units) of an index future at ₹2,502. The final settlement price on expiry is ₹2,545. What is the total MTM profit received over the contract's life?","options":["₹4,300","₹8,600","₹5,000","₹17,200"],"answer":1,"why":"Net MTM = (2,545 - 2,502) x 200 = ₹8,600, paid out through daily MTM and final settlement.","ref":"6.6","level":"medium"},{"q":"In a physically settled stock option, exercise of a long call results in:","options":["A buy position (securities receivable)","A sell position (securities deliverable)","Only a cash difference","Lapse of the contract"],"answer":0,"why":"Exercise of a long call creates a buy (receivable) position; assignment of a short call creates a sell position.","ref":"6.6","level":"medium"},{"q":"In a physically settled stock option, assignment of a short put results in:","options":["A sell position (securities deliverable)","Only a cash difference","A buy position (securities receivable)","No obligation"],"answer":2,"why":"The assigned put writer must buy the shares: a buy (receivable) position at the strike price.","ref":"6.6","level":"hard"},{"q":"A stock announces a 2:1 bonus (2 new shares for every 1 held). An option has strike ₹900 and market lot 300. What are the adjusted strike and lot?","options":["Strike ₹300, lot 900","Strike ₹450, lot 600","Strike ₹900, lot 300","Strike ₹2,700, lot 100"],"answer":0,"why":"Adjustment factor = (2+1)/1 = 3; strike ₹900 / 3 = ₹300; lot 300 x 3 = 900.","ref":"6.7.5.1","level":"hard"},{"q":"A rights issue has P = ₹200, S = ₹100 and ratio 1:4 (A = 1, B = 4). What is the adjustment factor?","options":["0.8","1.25","0.5","0.9"],"answer":3,"why":"E = (200 - 100) x 1/5 = ₹20; AF = (200 - 20)/200 = 0.9. Strike is multiplied and lot divided by 0.9.","ref":"6.7.5.2","level":"hard"},{"q":"For equity F&O adjustment, a dividend is treated as extraordinary when it is at or above what share of the market value of the stock?","options":["1%","5%","10%","2%"],"answer":3,"why":"Dividends below 2% are ordinary and need no adjustment; at or above 2% they are extraordinary.","ref":"6.7.5.3","level":"easy"},{"q":"A board announces a dividend after market hours on the 10th. For the 2% test, which market price is used?","options":["Closing price on the 9th","Average price of the past month","Closing price on the 10th","Price on the record date"],"answer":2,"why":"If the announcement comes after market hours, the same day's closing price is the market price.","ref":"6.7.5.3","level":"hard"},{"q":"To re-introduce derivatives on a demerged company, the pre-restructured company must have had a market capitalisation of at least:","options":["₹500 crore","₹2,000 crore","₹5,000 crore","₹1,000 crore"],"answer":3,"why":"One condition is a pre-restructuring market cap of at least ₹1,000 crore; the new company must also be at least one-third its size.","ref":"6.7.5.4","level":"medium"},{"q":"Corporate action adjustments in equity F&O are carried out on the last cum day, after the close of trading hours.","options":["True","False"],"answer":0,"why":"Adjustments are made on the last day the security trades cum-benefit in the cash market, after trading hours.","ref":"6.7.2","level":"easy"},{"q":"The clearing corporation always provides settlement guarantee for auctions of internal shortages.","options":["True","False"],"answer":1,"why":"CCs may charge fees for internal shortage auctions and may not provide settlement guarantee for them.","ref":"6.5.1.1","level":"medium"}]},{"id":7,"title":"Investor Grievances and Arbitration","short":"Grievances & ODR","weight":10,"minutes":40,"big_picture":"When something goes wrong with a trade, the investor climbs a ladder: first the broker (21 days to fix it), then SEBI's SCORES where the exchange and then SEBI review it, and alongside that SMART ODR, where the exchange tries to settle, a conciliator mediates, and finally an arbitrator decides. If the broker itself collapses, the exchange's Investor Protection Fund pays genuine claims. This chapter is the map of that ladder and the clock running at every rung.","exam_focus":["The 21-day rule everywhere: broker redressal, SCORES ATR, MII review in ODR, conciliation (plus max 10 days)","SCORES windows: 1 year to lodge, 15 days to seek each review, 10 days for the exchange's revised ATR; SCORES 2.0 from April 01, 2024","Arbitration thresholds: sole arbitrator up to ₹30 lakh, three-member tribunal above; document-only up to ₹1 lakh; award in 30 (+30) days","Money rules on brokers: 100% deposit of admissible claim before arbitration or a challenge; up to ₹5 lakh released to investor; award paid in 15 days; Section 34 intention in 7 days","What SCORES will not take (sub-judice, other regulators, unlisted/delisted companies, anonymous, price grievances)","IPF: set up by exchanges (1985 notification), 1% of listing fees, 70% of income ploughed back, no speculative claims, 3-year civil-dispute rule; ISF gets 20% of listing fees","Investor Charter timelines and ISC facilities (4 metros, 4 newspapers)"],"sections":[{"id":"7.1","title":"Introduction","blocks":[{"type":"p","text":"The chapter opens with a line the exam loves: <b>investors are the backbone of the securities market<\/b>. Protecting them from any wrongdoing, intentional or not, is paramount for intermediaries, exchanges and regulators."},{"type":"p","text":"An investor's grievance can be against <b>(a)<\/b> the intermediary/broking firm they trade through, or <b>(b)<\/b> the company whose shares they hold. This chapter is the map of where they go, in what order, and how fast each party must respond."}]},{"id":"7.2","title":"Investor grievance: the escalation ladder","blocks":[{"type":"p","text":"Grievances are handled at three levels: the <b>trading member<\/b>, the <b>stock exchange<\/b> and the <b>regulator<\/b> (SEBI, via SCORES). Alongside runs <b>SMART ODR<\/b> (online conciliation and arbitration). You always start at the bottom rung, and every rung has a clock."},{"type":"steps","items":[{"title":"Broker","text":"Complain to the compliance officer / grievance e-mail ID. Redressal within <b>21 calendar days<\/b>."},{"title":"SCORES","text":"Lodge within <b>1 year<\/b> of the cause of action. Auto-routed to the broker, who files an ATR within <b>21 calendar days<\/b>."},{"title":"First review: stock exchange","text":"Ask within <b>15 days<\/b> of the ATR; the exchange (Designated Body) gives a revised ATR within <b>10 days<\/b>."},{"title":"Second review: SEBI","text":"Ask within <b>15 days<\/b> of the exchange's ATR. Closed only when SEBI disposes of it."},{"title":"SMART ODR (any time after step 1)","text":"MII review, then conciliation, then online arbitration; finally a court challenge under Section 34."}]},{"type":"trap","text":"Approaching the entity first is <b>mandatory<\/b>. 'The investor can file directly on SCORES/ODR without approaching the broker' is a wrong option."},{"type":"table","head":["Stage","Time limit"],"rows":[["Broker redresses complaint","21 calendar days from receipt"],["Lodge on SCORES","Within 1 year of cause of action"],["Entity's ATR on SCORES","21 calendar days"],["Seek first review / second review","15 calendar days from the relevant ATR"],["Designated Body's revised ATR","10 calendar days from review sought"],["MII review of ODR complaint","21 days"],["Market Participant's notice before starting ODR","At least 15 calendar days"],["Conciliator appointed","Within 5 days of reference"],["Conciliation","21 calendar days + max 10 (parties' consent)"],["Broker's deposit after investor starts arbitration","10 days"],["Arbitral award","30 calendar days + up to 30 more"],["Pay the award / intention to challenge (s.34)","15 calendar days / 7 calendar days"],["Comply if no stay obtained","3 months from receipt of award"],["Arbitration reference limitation (exchanges)","3 years"]],"caption":"Master clock for this chapter"},{"type":"hook","text":"The 21-15-10 rhythm: <b>21<\/b> days for whoever must <i>act<\/i> (broker, ATR, MII, conciliator), <b>15<\/b> days for the investor to <i>ask<\/i> for review, <b>10<\/b> days for the exchange to <i>re-answer<\/i>."}]},{"id":"7.2.1","title":"Grievance handling at the trading member level","blocks":[{"type":"p","text":"Every broking firm has a <b>designated cell/person<\/b> for grievances, resolved at branch or firm level. Brokers must designate an <b>exclusive e-mail ID<\/b> of the grievance redressal division/compliance officer and display it on their website, pamphlets and advertisements."},{"type":"p","text":"Every broker and AP office displays <b>Exhibit 7.1<\/b>, a ladder in itself: compliance officer, then CEO/Partner/Proprietor, then the exchange (BSE, NSE, MSEI) or depository (CDSL, NSDL), then SEBI's SCORES (scores.sebi.gov.in) and toll-free helpline <b>1800 22 7575 / 1800 266 7575<\/b>."},{"type":"p","text":"The broker must endeavour to redress grievances within <b>21 calendar days<\/b> and keep records of complaints received and redressed. The <b>Investor Charter for Stock Brokers<\/b> (SEBI circular, February 21, 2025) sets out services, investor rights, broker activities with timelines, DOs and DON'Ts and the redressal mechanism. Brokers bring it to existing and new clients via website, office display, account opening kit and e-mails/letters."},{"type":"table","head":["Disclosure on broker's website","When","Source"],"rows":[["Complaints received and redressed (SEBI format)","Monthly, by the <b>7th of the succeeding month<\/b>","Investor Charter circular"],["Grievances received, redressed and <b>unresolved beyond three months<\/b>","End of each <b>quarter<\/b> of the financial year","SEBI (Intermediaries) Regulations, 2008"]]},{"type":"table","head":["Activity (Investor Charter)","Expected timeline"],"rows":[["KYC entered into KRA and CKYCR","3 working days of account opening"],["Client onboarding","Immediate, not later than one week"],["Order execution","Immediate, not later than the same day"],["Allocation of Unique Client Code","Before trading"],["Copy of completed Client Registration Documents","7 days from upload of UCC to the exchange"],["Contract notes","24 hours of execution"],["Upfront margin collection","Before initiation of trade"],["Intimation of other margin dues","End of T day"],["Settlement of client funds","First Friday/Saturday of month/quarter (exchange schedule)"],["Statement of Accounts (funds, securities, commodities)","Monthly"],["Retention statement of funds/commodities","5 days from settlement"],["Annual Global Statement","30 days from end of financial year"],["Investor grievance redressal","21 calendar days from receipt"]],"caption":"Investor Charter timelines"},{"type":"hook","text":"Charter in one breath: KYC <b>3<\/b> working days, onboarding <b>1<\/b> week, contract note <b>24<\/b> hours, CRD copy <b>7<\/b> days, retention statement <b>5<\/b> days, Annual Global Statement <b>30<\/b> days, grievance <b>21<\/b> days."},{"type":"trap","text":"<b>21 calendar<\/b> days, not working days and not 30. Monthly complaint data by the <b>7th<\/b> is different from the <b>quarterly<\/b> upload of grievances pending beyond three months."}]},{"id":"7.2.2","title":"Exchange and SEBI level: SCORES and SCORES 2.0","blocks":[{"type":"p","text":"If unhappy with the broker, the investor can go to the exchange or SEBI. SEBI's <b>SCORES (SEBI Complaints Redress System)<\/b> is a <b>web-based, centralised, 24x7<\/b> system for complaints against <b>listed companies and registered intermediaries<\/b>: one central database, online movement of complaints to entities, online upload of <b>Action Taken Reports (ATRs)<\/b> and real-time status tracking."},{"type":"p","text":"Investors register on SCORES and get an <b>e-mail acknowledgement<\/b>. A <b>paper complaint<\/b> is digitised by SEBI and uploaded; follow-up is electronic only. SEBI-recognised <b>Investor Associations<\/b> and SEBI's toll-free helpline help investors file."},{"type":"key","text":"Taking the grievance to the entity first is <b>mandatory<\/b>. Only if the entity fails to redress it in time can the investor use SCORES."},{"type":"p","text":"<b>Revised framework<\/b> (SEBI circular, September 20, 2023), which also linked SCORES to ODR:"},{"type":"steps","items":[{"title":"Auto-forward","text":"The complaint goes automatically to the entity."},{"title":"ATR in 21 days","text":"The entity resolves it and uploads an ATR within <b>21 calendar days<\/b>; it is auto-routed to the complainant. The <b>Designated Body<\/b> (for a broker, the <b>stock exchange<\/b>) ensures timely ATRs."},{"title":"First review","text":"Complainant seeks review within <b>15 calendar days<\/b> of the ATR. The Designated Body may seek clarification from the entity and submits a revised ATR within <b>10 calendar days<\/b>."},{"title":"Second review","text":"Within <b>15 calendar days<\/b> of the Designated Body's ATR. SEBI may take cognizance if the complainant is unhappy, or the Designated Body missed its 10 days."},{"title":"Closure","text":"Satisfied, or no review sought in 15 days: disposed. A second-review complaint closes only when <b>SEBI<\/b> disposes/closes it, not on mere filing of an ATR."}]},{"type":"p","text":"<b>Time limit.<\/b> The limitation for an arbitration reference with exchanges is <b>three years<\/b>; a SCORES complaint must be lodged within <b>one year of the cause of action<\/b>, where the entity <b>rejected<\/b> the complaint, <b>did not respond<\/b>, or the reply was <b>unsatisfactory<\/b>. SEBI may reject complaints older than one year or not first taken to the entity. Status is tracked with a <b>unique complaint registration number<\/b>; every complaint has an audit trail."},{"type":"key","text":"ODR or civil remedies can be used <b>at any time<\/b>; if chosen while a complaint is pending on SCORES, the SCORES complaint is treated as <b>disposed<\/b>."},{"type":"compare","items":[{"title":"Not dealt through SCORES","points":["Unlisted/delisted companies, or those on the dissemination board","Sub-judice matters (court or quasi-judicial)","Other regulators (RBI, IRDAI, PFRDA, CCI) or ministries (MCA)","Sick companies, or moratorium in winding up/insolvency","Companies struck off by RoC / vanishing companies; under liquidation/BIFR","Disputes pending with the ODR mechanism of MIIs"]},{"title":"Not a 'complaint' at all","points":["Not about securities market investment","Anonymous (whistleblowers excepted); incomplete; no supporting documents","Suggestions or requests for guidance","Unhappy with a share's trading price","Non-listing of private offer shares; private agreement disputes","Fake/forged documents; outside SEBI's purview; unregulated activity"]}]},{"type":"p","text":"The workbook also retains an older <b>one-time 'Review' option<\/b>: within <b>15 days of closure<\/b> on SCORES, escalated to the supervising official of the SEBI dealing officer. SCORES 2.0 has turned this into the two-level review above; the investor's window is <b>15 days<\/b> either way."},{"type":"p","text":"Exchanges, depositories and clearing corporations must show on their <b>website and app home pages<\/b> a link to lodge complaints with them and a link to SCORES / its app."},{"type":"p","text":"<b>SCORES 2.0<\/b>, effective <b>April 01, 2024<\/b> (https://scores.sebi.gov.in), is the only version for lodging complaints from that date. Its features:"},{"type":"list","items":["Uniform <b>21 calendar day<\/b> timeline across the market","<b>Auto-routing<\/b> to the entity and <b>auto-escalation<\/b> when the entity or Designated Body misses its timeline","<b>Monitoring<\/b> by Designated Bodies","<b>Two-level review<\/b>: Designated Body first, SEBI second","<b>KRA database integration<\/b> for easy registration"]},{"type":"trap","text":"One year to lodge on SCORES versus three years limitation for arbitration with exchanges. Do not swap them."}]},{"id":"7.2.3","title":"Investor Service Centres (ISCs)","blocks":[{"type":"p","text":"SEBI's circular of <b>December 03, 1997<\/b> requires every exchange to maintain <b>at least one ISC<\/b> for counselling and basic facilities. ISCs are mandatory in the <b>four metros (New Delhi, Mumbai, Chennai, Kolkata)<\/b>; exchanges with <b>nationwide terminals<\/b> also open them in <b>12 cities<\/b>: Ahmedabad, Hyderabad, Kanpur, Indore, Bangalore, Pune, Jaipur, Ghaziabad, Lucknow, Gurgaon, Patna and Vadodara. More can be opened wherever required, and an ISC can be run by one exchange or <b>jointly<\/b> by two or more."},{"type":"list","items":["<b>Four financial dailies<\/b>, at least one in the regional language","Internet-connected computer to access SEBI and exchange grievance portals","Complaints accepted in <b>physical and electronic<\/b> form; facilitation desks for dispute resolution","<b>Arbitration and appellate arbitration<\/b> facility with <b>video-calling<\/b> for online hearings","Meeting room for at least <b>5-6 persons<\/b> plus seating for 5-6 more","Library of laws and investor material (copies at minimal cost); visitor register; phone, photocopier, printer, scanner"]},{"type":"p","text":"ISC staff must be trained in market operations, grievance resolution and SCORES. The <b>Investor Charter for Stock Exchanges<\/b> (modified May 2024 for ODR and SCORES 2.0) adds investor responsibilities and a code of conduct for exchanges. Complaints reach an exchange via <b>SCORES 2.0<\/b> (exchange first review, SEBI second), the exchange's web portal, designated e-mail IDs, or <b>SMART ODR<\/b>."},{"type":"hook","text":"Picture an ISC: 4 newspapers on the rack (one regional), a 5-6 seat meeting room, and a laptop for video-calling the arbitrator."}]},{"id":"7.3","title":"SMART ODR: Online Dispute Resolution","blocks":[{"type":"p","text":"SEBI set up a common <b>ODR Portal (SMART ODR)<\/b> that resolves disputes with listed companies, intermediaries and MIIs through <b>online conciliation<\/b> and <b>online arbitration<\/b>. Why? A retail investor fighting a broker in court could wait years; ODR fixes a short timetable and lets everyone join by video."},{"type":"steps","items":[{"title":"Market Participant","text":"Investor first complains to the broker/intermediary/company."},{"title":"SCORES or ODR","text":"If unhappy, escalate on SCORES, or file on SMART ODR."},{"title":"MII review: 21 days","text":"The exchange/depository tries to resolve it amicably."},{"title":"Conciliation: 21 + 10 days","text":"A conciliator attempts settlement; 10-day extension with consent."},{"title":"Arbitration: 30 + 30 days","text":"If conciliation fails, the investor may seek arbitration."},{"title":"Section 34","text":"A dissatisfied party may challenge the award under the Arbitration and Conciliation Act, 1996."}]},{"type":"hook","text":"Review 21, Reconcile 21 (+10), Rule 30 (+30). Talk first, mediate second, decide last."}]},{"id":"7.3.1","title":"Who is covered by ODR","blocks":[{"type":"p","text":"Disputes between <b>investors/clients<\/b> and <b>listed companies (including RTAs)<\/b> or <b>specified intermediaries/regulated entities<\/b> are resolved online. Either side, including nominees/transmission holders, may also refer unresolved <b>service-related complaints<\/b> (delayed statements or bills, account freezing, unexplained debits, branch closed without notice, demat account transferred without permission, etc.)."},{"type":"p","text":"Specified entities: AIF managers, Bankers to an Issue and SCSBs, CIS managers, commodity clearing corporations, DPs, Investment Advisers, InvIT and REIT managers, Merchant Bankers, Mutual Funds (AMCs), Portfolio Managers, RTAs, Research Analysts and <b>stock brokers<\/b> (including Online Bond Platforms)."},{"type":"compare","items":[{"title":"Retail investor","points":["Uses SEBI's ODR route (SMART ODR)","Seat: where the investor permanently resides"]},{"title":"Institutional/corporate client","points":["<b>Option<\/b>: SEBI's ODR route, OR any independent institutional mediation/conciliation/arbitration in India","Seat and venue in India; may be online"]}]},{"type":"p","text":"Contractual disputes between <b>MIIs and their constituents<\/b> will be added later; disputes over MIIs' <b>regulatory/enforcement role<\/b> are excluded."}]},{"id":"7.3.2","title":"Empanelment of ODR Institutions","blocks":[{"type":"p","text":"An <b>ODR Institution<\/b> runs the actual conciliation and arbitration. Each <b>MII empanels one or more<\/b>, after collecting its registration, constitution, conciliation/arbitration rules, PAN, <b>LEI<\/b>, board composition, shareholders and authorised signatories. It must be a member of the association of MII-empanelled ODR Institutions."},{"type":"key","text":"An MII's <b>primary/first<\/b> ODR Institution cannot be the primary/first ODR Institution of any other MII."}]},{"id":"7.3.3","title":"The common ODR Portal","blocks":[{"type":"list","items":["The <b>MIIs jointly establish and operate<\/b> the portal with their ODR Institutions, sharing costs under an inter-MII agreement.","<b>SEBI inspects<\/b> it from time to time.","ODR Institutions must do time-bound online conciliation/arbitration under the <b>Arbitration and Conciliation Act, 1996<\/b>.","The portal connects with <b>SCORES / SEBI Intermediary portal<\/b>.","All market participants must enroll within SEBI's timeline, after which they are <b>deemed enrolled<\/b>."]}]},{"id":"7.3.4","title":"Starting dispute resolution","blocks":[{"type":"p","text":"Normal route: complain to the Market Participant, then SCORES, then ODR. <b>Alternatively<\/b>, ODR can be started once the Market Participant fails to resolve it, or <b>at any stage<\/b> of the SCORES escalation. The one prerequisite: the complaint must first go to the intermediary."},{"type":"p","text":"The relevant <b>MII reviews<\/b> the ODR complaint and tries to resolve it within <b>21 days<\/b>; if not, it goes to <b>conciliation<\/b>."},{"type":"key","text":"A <b>Market Participant<\/b> may also start ODR, after giving the investor at least <b>15 calendar days' notice<\/b>."}]},{"id":"7.3.5","title":"ODR Portal and allocation","blocks":[{"type":"p","text":"The portal enrolls parties, accepts complaints and documents, and shows status updates from ODR Institutions. Typical documents: a statement of the dispute (<b>delivery-based and squared-off trades shown separately<\/b>), contract notes, bills, broker's account statement, share delivery records, margin statement, Member Constituent Agreement, Risk Disclosure Document, PAN/GIR number, balance sheet showing dues, latest ITR acknowledgement, and a list of documents."},{"type":"p","text":"Disputes are allotted to empanelled ODR Institutions on a <b>market-wide round-robin<\/b> basis, after the MII's review (concluded within <b>21 calendar days<\/b>)."}]},{"id":"7.3.6","title":"Conciliation","blocks":[{"type":"steps","items":[{"title":"Appoint","text":"The ODR Institution appoints a <b>sole, independent, neutral conciliator<\/b> within <b>5 days<\/b> of the reference."},{"title":"Settle","text":"Meetings aim at settlement within <b>21 calendar days<\/b> of appointment, extendable by <b>max 10 calendar days<\/b> with the parties' recorded consent."},{"title":"Success","text":"A <b>settlement agreement<\/b>, executed and stamped online."},{"title":"Failure","text":"The conciliator fixes the <b>admissible claim value<\/b> payable to the investor and notifies parties, ODR Institution and MII."},{"title":"Next","text":"The investor may go to online arbitration, run by the <b>same ODR Institution<\/b>. A Market Participant wanting arbitration must first <b>deposit 100% of the admissible claim value<\/b> with the MII."}]},{"type":"p","text":"A Market Participant that does not deposit <b>cannot initiate arbitration<\/b> and may face exchange action. On the investor's application, the MII may release up to <b>₹5,00,000<\/b> from the deposit, against an undertaking/indemnity/security to refund it if the investor loses."},{"type":"example","text":"Meena claims ₹8 lakh. Conciliation fails; the admissible claim is fixed at ₹6 lakh. Her broker wants arbitration, so it deposits ₹6 lakh with the exchange. Meena can get up to ₹5 lakh released now, on an undertaking to refund if she loses.","title":"The ₹5 lakh release"},{"type":"trap","text":"₹5 lakh caps the <b>interim release<\/b> to the investor; ₹30 lakh is the sole-arbitrator limit; ₹1 lakh is the document-only limit."}]},{"id":"7.3.7","title":"Conciliation fees","blocks":[{"type":"p","text":"Conciliation fees may be <b>borne by the MIIs<\/b> and recovered from the Market Participant complained against; if the Market Participant starts the dispute, it pays directly. Fees can <b>never be shifted to the investor<\/b>. Conciliation is <b>unsuccessful<\/b> if no settlement is reached within the stipulated (or extended) time."},{"type":"key","text":"Late fee: conciliation started more than <b>six months<\/b> after the transaction/dispute costs <b>₹1,000<\/b>, paid by the initiator (investor or Market Participant), collected by MIIs."}]},{"id":"7.3.8","title":"Arbitration","blocks":[{"type":"p","text":"Arbitration is a <b>quasi-judicial<\/b> alternate dispute resolution mechanism under the <b>Arbitration and Conciliation Act, 1996<\/b>, meant to give <b>quicker<\/b> resolution than courts. After failed conciliation, the investor starts online arbitration by paying fees, and the broker must participate."},{"type":"table","head":["Who starts arbitration","Broker must"],"rows":[["Investor","Deposit <b>100% of admissible claim<\/b> with the MII and pay fees within <b>10 days<\/b>"],["Broker","Inform the ODR Institution within <b>10 days<\/b> of conciliation ending; deposit full claim within a further <b>5 days<\/b>"]]},{"type":"table","head":["Claim / counter-claim","Arbitrator(s)","Process","Award"],"rows":[["Up to ₹1 lakh","Sole","<b>Document-only<\/b> (hearing only for recorded reasons)","30 calendar days from appointment"],["Above ₹1 lakh up to ₹30 lakh","<b>Sole<\/b> independent, neutral arbitrator","Hearing(s)","30 days; may extend up to 30 more (recorded reasons)"],["Above ₹30 lakh","<b>Tribunal of three<\/b>","Hearing(s)","30 days; may extend up to 30 more (recorded reasons)"]],"caption":"Arbitration by claim size"},{"type":"p","text":"A non-cooperating party can face an <b>ex-parte order<\/b> after <b>7 calendar days' notice<\/b>. Arbitrators may grant <b>interim relief<\/b> after hearing the parties; parties may seek correction of the award under the Act."},{"type":"steps","items":[{"title":"Pay","text":"The Market Participant pays within <b>15 calendar days<\/b> of the award (unless sooner). The MII helps the investor enforce it."},{"title":"Signal a challenge","text":"The losing party files its intention to challenge under <b>Section 34<\/b> within <b>7 calendar days<\/b> on the ODR Portal."},{"title":"Deposit to challenge","text":"A Market Participant must deposit <b>100% of the award amount<\/b> with the MII before challenging."},{"title":"Stay or comply","text":"No stay within <b>3 months<\/b> of receipt of the award means full compliance. The MII monitors compliance."}]},{"type":"hook","text":"After the award: <b>7<\/b> days to say 'I'll challenge', <b>15<\/b> days to pay, <b>3 months<\/b> to get a stay. A broker never fights for free: 100% deposit before arbitration, 100% before a challenge."},{"type":"trap","text":"Sole arbitrator up to <b>₹30 lakh<\/b>, not ₹5, 20 or 50 lakh. The ODR flow summary says the 30-day arbitration period is extendable by 30 days with the parties' consent; the detailed rule lets the arbitrator extend for recorded reasons. The numbers (30 + 30) are what get tested."}]},{"id":"7.3.9","title":"Form of proceedings and seat","blocks":[{"type":"p","text":"Proceedings are <b>online<\/b> (audio-video). Investors may join from the <b>ISC of any MII<\/b>."},{"type":"table","head":["Dispute","Deemed seat and venue"],"rows":[["Investor vs listed company / intermediary","Where the investor <b>resides permanently<\/b> (non-individual: registered office/principal place of business in India per KYC)"],["Institutional/corporate client vs intermediary","Client's registered/principal place in India; if none in India, the intermediary's; or a competent court in India they agree on"]]}]},{"id":"7.3.10","title":"Arbitration fees and late fees","blocks":[{"type":"p","text":"Fees depend on the <b>claim amount<\/b>, with separate fees for the <b>arbitrator<\/b> and the <b>ODR Institution<\/b>, collected by the ODR Institution."},{"type":"table","head":["Delay","Late fee"],"rows":[["Arbitration started after 1 month and up to 6 months from failed conciliation","<b>Double<\/b> the non-refundable fees"],["Arbitration started after 6 months by a <b>Market Participant<\/b>","Additional <b>50% of fees per extra month<\/b>, non-refundable"],["Conciliation started over 6 months after the dispute","₹1,000 by the initiator"]]}]},{"id":"7.3.11","title":"Market Participants' responsibilities under ODR","blocks":[{"type":"list","items":["All client agreements are <b>deemed amended<\/b> to include online conciliation/arbitration via the ODR Portal.","Attend promptly to complaints; communications must tell investors about <b>SCORES and the ODR Portal<\/b>.","Train staff for complaints, SCORES/ODR references and online proceedings; cooperate with MIIs and ODR Institutions.","SEBI may require an <b>interest-free deposit<\/b> with MIIs/Designated Body to honour awards or amounts payable pending arbitration or challenge."]}]},{"id":"7.4","title":"Broker default and the Investor Protection Fund","blocks":[{"type":"steps","items":[{"title":"Declare","text":"Exchange issues a <b>circular<\/b> declaring the broker a defaulter and posts it on its website."},{"title":"Invite claims","text":"A <b>public notice<\/b> invites claims within a <b>specified period<\/b>."},{"title":"Reach clients","text":"Clients are informed by <b>e-mail and SMS<\/b> to lodge claims."},{"title":"Sanction","text":"Claims go to the <b>Member Committee<\/b> for sanction and ratification."},{"title":"Pay","text":"The <b>IPF Trust<\/b> disburses, up to the maximum fixed for a single claim."}]},{"type":"p","text":"The exchange website carries eligibility norms, claim form, FAQs, online claim status, SOP and claim-processing policy, and the list of defaulter/expelled TMs. Exchanges, depositories and clearing corporations also disclose complaints received against them by the <b>7th of the succeeding month<\/b>."},{"type":"p","text":"The <b>Central Government<\/b>, by notification of <b>August 22, 1985<\/b>, required exchanges to set up an <b>IPF<\/b> (also called Customer Protection Fund). It pays <b>legitimate, non-speculative<\/b> claims of clients of members <b>declared defaulters or expelled<\/b>, and is administered by a <b>Trust<\/b>. SEBI's comprehensive guidelines (May 2023) require <b>all exchanges and depositories<\/b> to have an IPF, each through a <b>separate trust<\/b>."},{"type":"table","head":["Exchange's contribution to IPF","Amount"],"rows":[["Listing fees","<b>1%<\/b>, quarterly"],["Interest on the issuer's 1% security deposit (public issue)","<b>100%<\/b> of interest, on refund"],["Penalties: client code modification; call-auction pay-in default; LODR non-compliance by listed companies","Amount collected"],["Penalty on investor pay-in default in <b>OFS<\/b>","<b>10% of order value<\/b>"],["Transaction charges","As per exchange policy"],["Income from IPF investments","<b>At least 70%<\/b>"]]},{"type":"list","items":["<b>Use<\/b>: claims of clients of defaulting TMs and <b>interim relief<\/b> to investors.","<b>Income<\/b>: at least <b>70%<\/b> ploughed back; <b>25%<\/b> may fund investor education/awareness.","<b>Review<\/b>: corpus adequacy <b>half-yearly<\/b> (end March and September).","<b>Eligible<\/b>: claims within the specified period, including clients who dealt through the defaulter's <b>registered authorised persons<\/b>. <b>Speculative<\/b> claims excluded.","<b>Late<\/b>: claims more than <b>three years<\/b> after the specified period ends may be treated as a <b>civil dispute<\/b>.","<b>Limits<\/b>: per-investor compensation fixed by the exchange with the IPF Trust and SEBI.","<b>Disclosure<\/b>: IPF corpus on the website, <b>updated monthly<\/b>.","<b>No double pay<\/b>: exchanges share data on clients of defaulter members within <b>10 days<\/b> of disablement, and PAN, UCC and amount when paying."]},{"type":"hook","text":"IPF income: <b>70 back, 25 to teach<\/b>."},{"type":"trap","text":"IPF does not cover speculative claims, but <b>does<\/b> cover clients who dealt via the defaulter's registered AP."}]},{"id":"7.4.1","title":"Investor Services Fund (ISF)","blocks":[{"type":"p","text":"Exchanges set aside <b>at least 20% of listing fees<\/b> for the ISF, supervised by the <b>Regulatory Oversight Committee<\/b>. It can be used <b>only<\/b> for investor education and awareness: seminars, workshops, publications, training."},{"type":"compare","items":[{"title":"IPF","points":["Compensates clients of defaulting/expelled members","1% of listing fees (quarterly)","Run by an IPF Trust"]},{"title":"ISF","points":["Investor education and awareness only","At least 20% of listing fees","Supervised by the Regulatory Oversight Committee"]}]}]}],"numbers":[{"fact":"Broker's timeline to redress an investor grievance","value":"21 calendar days from receipt","ref":"7.2.1"},{"fact":"Brokers disclose monthly complaint data on website","value":"By the 7th of the succeeding month","ref":"7.2.1"},{"fact":"Quarterly upload: grievances unresolved beyond","value":"Three months (Intermediaries Regulations, 2008)","ref":"7.2.1"},{"fact":"Investor Charter for Stock Brokers circular","value":"February 21, 2025","ref":"7.2.1"},{"fact":"SEBI toll-free helpline","value":"1800 22 7575 / 1800 266 7575","ref":"7.2.1"},{"fact":"Charter: KYC entered into KRA and CKYCR","value":"3 working days of account opening","ref":"7.2.1"},{"fact":"Charter: client onboarding","value":"Immediate, not later than one week","ref":"7.2.1"},{"fact":"Charter: order execution","value":"Immediate, not later than the same day","ref":"7.2.1"},{"fact":"Charter: allocation of UCC","value":"Before trading","ref":"7.2.1"},{"fact":"Charter: copy of Client Registration Documents","value":"7 days from upload of UCC to exchange","ref":"7.2.1"},{"fact":"Charter: contract notes","value":"24 hours of execution","ref":"7.2.1"},{"fact":"Charter: upfront margin collection","value":"Before initiation of trade","ref":"7.2.1"},{"fact":"Charter: intimation of other margin dues","value":"End of T day","ref":"7.2.1"},{"fact":"Charter: settlement of client funds","value":"First Friday/Saturday of month/quarter (exchange schedule)","ref":"7.2.1"},{"fact":"Charter: statement of accounts","value":"Monthly","ref":"7.2.1"},{"fact":"Charter: retention statement","value":"5 days from settlement","ref":"7.2.1"},{"fact":"Charter: Annual Global Statement","value":"30 days from end of financial year","ref":"7.2.1"},{"fact":"SCORES availability","value":"24x7","ref":"7.2.2"},{"fact":"Revised SCORES framework circular","value":"September 20, 2023","ref":"7.2.2"},{"fact":"Entity resolves SCORES complaint and uploads ATR","value":"21 calendar days of receipt","ref":"7.2.2"},{"fact":"Investor seeks first review (Designated Body)","value":"Within 15 calendar days of ATR","ref":"7.2.2"},{"fact":"Designated Body submits revised ATR","value":"Within 10 calendar days of review sought","ref":"7.2.2"},{"fact":"Investor seeks second review (SEBI)","value":"Within 15 calendar days of Designated Body's ATR","ref":"7.2.2"},{"fact":"Time limit to lodge a complaint on SCORES","value":"1 year from date of cause of action","ref":"7.2.2"},{"fact":"Limitation for arbitration reference with exchanges","value":"3 years","ref":"7.2.2"},{"fact":"Old one-time SCORES review option","value":"Within 15 days of closure on SCORES","ref":"7.2.2"},{"fact":"SCORES 2.0 effective from","value":"April 01, 2024","ref":"7.2.2"},{"fact":"SCORES review levels in 2.0","value":"2 (Designated Body, then SEBI)","ref":"7.2.2"},{"fact":"ISC circular","value":"December 03, 1997","ref":"7.2.3"},{"fact":"Minimum ISCs per exchange","value":"At least one","ref":"7.2.3"},{"fact":"Metro cities with mandatory ISCs","value":"4: New Delhi, Mumbai, Chennai, Kolkata","ref":"7.2.3"},{"fact":"Additional ISC cities for nationwide exchanges","value":"12 cities","ref":"7.2.3"},{"fact":"Financial dailies at an ISC","value":"4 (at least 1 regional language)","ref":"7.2.3"},{"fact":"ISC meeting room capacity","value":"At least 5-6 persons (+ seating for 5-6)","ref":"7.2.3"},{"fact":"Investor Charter for Stock Exchanges (modified)","value":"May 2024","ref":"7.2.3"},{"fact":"MII review of complaint on SMART ODR","value":"21 (calendar) days","ref":"7.3.4"},{"fact":"Notice by Market Participant before starting ODR","value":"At least 15 calendar days","ref":"7.3.4"},{"fact":"ODR Institution appoints conciliator","value":"Within 5 days of receiving reference","ref":"7.3.6"},{"fact":"Conciliation period","value":"21 calendar days from conciliator's appointment","ref":"7.3.6"},{"fact":"Maximum extension of conciliation","value":"10 calendar days, with parties' consent","ref":"7.3.6"},{"fact":"Deposit by Market Participant to pursue arbitration","value":"100% of admissible claim value, with MII","ref":"7.3.6"},{"fact":"Maximum release to investor from MP's deposit","value":"₹5,00,000","ref":"7.3.6"},{"fact":"Late fee: conciliation initiated after 6 months","value":"₹1,000 by initiator","ref":"7.3.7"},{"fact":"Arbitration law","value":"Arbitration and Conciliation Act, 1996","ref":"7.3.8"},{"fact":"Broker deposit and fees after investor starts arbitration","value":"Within 10 days","ref":"7.3.8"},{"fact":"Broker-initiated arbitration: inform ODR Institution","value":"Within 10 days of conciliation ending","ref":"7.3.8"},{"fact":"Broker-initiated arbitration: deposit full claim","value":"Additional 5 days","ref":"7.3.8"},{"fact":"Sole arbitrator","value":"Claims up to ₹30 lakh","ref":"7.3.8"},{"fact":"Arbitral tribunal of three arbitrators","value":"Claims above ₹30 lakh","ref":"7.3.8"},{"fact":"Document-only arbitration","value":"Claim/counter-claim of ₹1 lakh or below","ref":"7.3.8"},{"fact":"Arbitral award timeline","value":"30 calendar days from appointment","ref":"7.3.8"},{"fact":"Extension of arbitration timeline","value":"Up to further 30 calendar days","ref":"7.3.8"},{"fact":"Notice before ex-parte order","value":"7 calendar days","ref":"7.3.8"},{"fact":"Market Participant pays arbitral award","value":"Within 15 calendar days of award","ref":"7.3.8"},{"fact":"Intention to challenge award (Section 34)","value":"Within 7 calendar days, on ODR Portal","ref":"7.3.8"},{"fact":"Comply in full if no stay obtained within","value":"3 months from receipt of award","ref":"7.3.8"},{"fact":"Deposit by Market Participant to challenge award","value":"100% of amount payable under award","ref":"7.3.8"},{"fact":"Late fee: arbitration after 1 month up to 6 months of failed conciliation","value":"Double the non-refundable fees","ref":"7.3.10"},{"fact":"Late fee: arbitration by Market Participant after 6 months","value":"Additional 50% of fees per additional month","ref":"7.3.10"},{"fact":"Exchanges/depositories/CCs disclose complaint data","value":"By 7th of succeeding month","ref":"7.4"},{"fact":"Central Government notification on IPF","value":"August 22, 1985","ref":"7.4"},{"fact":"SEBI comprehensive IPF/ISF guidelines","value":"May 2023","ref":"7.4"},{"fact":"IPF contribution from listing fees","value":"1%, quarterly","ref":"7.4"},{"fact":"IPF contribution from interest on issuer's security deposit","value":"100% of interest (on the 1% deposit)","ref":"7.4"},{"fact":"Penalty for investor pay-in default in OFS (to IPF)","value":"10% of order value","ref":"7.4"},{"fact":"IPF income ploughed back into IPF","value":"At least 70%","ref":"7.4"},{"fact":"IPF income usable for investor education/awareness","value":"25%","ref":"7.4"},{"fact":"IPF corpus adequacy review","value":"Half-yearly (end of March and September)","ref":"7.4"},{"fact":"Claim after specified period treated as civil dispute","value":"More than 3 years after expiry of specified period","ref":"7.4"},{"fact":"IPF corpus disclosure on exchange website","value":"Updated monthly","ref":"7.4"},{"fact":"Exchanges share data on clients of defaulter members","value":"Within 10 days of disablement","ref":"7.4"},{"fact":"ISF share of listing fees","value":"At least 20%","ref":"7.4.1"}],"flashcards":[{"q":"Who is the 'backbone' of the securities market?","a":"Investors."},{"q":"Two kinds of party an investor may have a grievance against?","a":"(a) The intermediary/broking firm they trade through; (b) the company in which they hold shares."},{"q":"Three levels at which grievances are handled?","a":"Trading member (broker) level, stock exchange level, and regulator (SEBI/SCORES) level."},{"q":"Within how many days should a broker redress an investor complaint?","a":"21 calendar days from receipt of the complaint."},{"q":"What is Exhibit 7.1?","a":"The standard notice every broker/AP office displays: compliance officer, CEO/partner, exchange/depository contacts, SCORES and SEBI helpline."},{"q":"By when must brokers publish monthly complaint data on their website?","a":"By the 7th of the succeeding month, in SEBI's format."},{"q":"What does SCORES stand for?","a":"SEBI Complaints Redress System: a 24x7 web-based centralised system for complaints against listed companies and registered intermediaries."},{"q":"What is an ATR?","a":"Action Taken Report: the entity's response uploaded on SCORES, due within 21 calendar days."},{"q":"Who is the Designated Body on SCORES for a stock broker?","a":"The stock exchange."},{"q":"Window to seek first review on SCORES?","a":"15 calendar days from the date of the entity's ATR."},{"q":"How fast must the Designated Body give a revised ATR?","a":"Within 10 calendar days of the review being sought."},{"q":"Time limit to lodge a complaint on SCORES?","a":"Within one year from the date of cause of action (after first approaching the entity)."},{"q":"What happens to a SCORES complaint if the investor opts for ODR meanwhile?","a":"It is treated as disposed on SCORES."},{"q":"When did SCORES 2.0 start?","a":"April 01, 2024 (https://scores.sebi.gov.in)."},{"q":"Name four SCORES 2.0 features.","a":"Uniform 21-day timeline, auto-routing, auto-escalation, two-level review (Designated Body then SEBI), KRA integration, Designated Body monitoring."},{"q":"Can SCORES take a sub-judice
