osses are added at broker level."},{"q":"What is ICMTM?","a":"Intraday Crystallised MTM: the loss on trades opened and closed the same day, at weighted average prices, blocked in real time."},{"q":"What four requirements must liquid assets cover?","a":"MTM losses, VaR margin, Extreme Loss Margin and Base Minimum Capital."},{"q":"Can non-cash liquid assets be used to pay MTM losses?","a":"No. MTM must be paid in cash or cash equivalents."},{"q":"BMC for a broker that uses algorithmic trading?","a":"₹50 lakh, whatever its client/proprietary mix."},{"q":"BMC for a broker on several segments of the same exchange?","a":"The highest BMC among those segments, not the total."},{"q":"Effect of early pay-in of securities on margins?","a":"That position is excluded from margins; all margins are deemed collected and no short-collection penalty arises."},{"q":"What does a kill switch do?","a":"Cancels all of a member's outstanding orders with a single command."},{"q":"What triggers and ends risk reduction mode?","a":"Starts at 90% collateral utilisation; normal mode resumes when it falls below 85%."},{"q":"What is SPAN and who developed it?","a":"Standard Portfolio Analysis of Risk, from the Chicago Mercantile Exchange: portfolio margin from the worst of 16 scenarios."},{"q":"Minimum Margin Period of Risk for equity derivatives?","a":"2 days, set per product based on its liquidity."},{"q":"Calendar spread charges?","a":"Index derivatives: 1.75% of far month contract. Single stock derivatives: 2.2% of far month contract."},{"q":"On expiry day, which calendar spreads lose the spread benefit?","a":"Only spreads with a leg in the contract expiring that day; spreads between later expiries keep it."},{"q":"What is Net Option Value and where does it go?","a":"Long option value minus short option value; added to the CM's liquid net worth. Option MTM is not settled in cash."},{"q":"From when must option buyers pay premium upfront?","a":"February 01, 2025, in the equity derivatives segment."},{"q":"When do delivery margins start on physically settled contracts?","a":"Four days before expiry; for a Thursday expiry, from the previous Friday EOD."},{"q":"Additional ELM on options expiry day?","a":"2% on short index options expiring that day, both those open at day start and those written during the day."},{"q":"Define liquid net worth of a clearing member.","a":"Liquid assets minus initial margin and ELM on gross open positions; must stay at least ₹50 lakh."},{"q":"How is MWPL for a single stock computed?","a":"Lower of 15% of free float and 65 × ADDV, with a floor of 10% of free float."},{"q":"What is FutEq OI?","a":"Net delta-adjusted open position across futures and options of an underlying, added up across all UCCs."},{"q":"Derivatives: deadline to collect delivery margin and consolidated crystallised obligation margin?","a":"By T+1."},{"q":"How is the peak margin penalty computed?","a":"On the higher of the EOD shortfall and the peak (snapshot) shortfall; minimum 4 snapshots a day."},{"q":"What is the 'Client Securities Margin Pledge Account'?","a":"The separate demat account a TM/CM opens to receive clients' margin pledges and to re-pledge them onward."},{"q":"What is DDPI?","a":"Demat Debit and Pledge Instruction: used for settlement transfers and pledges/re-pledges in place of a Power of Attorney."},{"q":"USCNBA vs DSCNBA?","a":"Up Streaming account receives client funds; Down Streaming account is the only account for paying clients."},{"q":"Which client funds forms can be upstreamed to the CC?","a":"Cash, lien on FDRs from client funds, or pledge of overnight MF scheme units bought with client funds."},{"q":"What is CUSPA?","a":"Client Unpaid Securities Pledgee Account: the TM account to which unpaid (non-MTF) securities are auto-pledged in the client's demat."},{"q":"Key CUSPA timelines?","a":"Client pays within 5 trading days of pay-out; auto-release at end of 6th; extension request by 6 p.m. on 5th day."},{"q":"Can a TM give exposure against, or bank-pledge, CUSPA securities?","a":"Neither. They may count for margin reporting, but give no exposure and cannot go to banks/NBFCs."},{"q":"When must the Annual Global Statement be issued?","a":"Within 30 days from the end of the financial year."},{"q":"CTR, STR and NTR deadlines?","a":"CTR and NTR by the 15th of the next month; STR within 7 days of concluding suspicion."},{"q":"Four steps of Risk Based Supervision?","a":"Risk assessment, risk and impact rating, supervisory risk rating score, supervisory approach."},{"q":"Parameters for QSB designation?","a":"Active clients, client assets, trading volumes, clients' EOD margin obligations and proprietary trading volumes."},{"q":"Core SGF contribution shares?","a":"CC at least 50% of MRC, stock exchange at least 25%, all clearing members together at most 25%."},{"q":"Who manages the Core SGF?","a":"The Regulatory Oversight Committee (ROC) of the clearing corporation."},{"q":"First and last layers of the default waterfall?","a":"First: the defaulting member's own monies. Last: pro-rata haircut to pay-outs."}],"questions":[{"q":"Which of the following is a risk containment measure used by a clearing corporation?","options":["Checking margin requirements","Checking the net worth of the client/investor","Checking whether the order placed is genuine","Checking the client's income tax returns"],"answer":0,"why":"CC risk containment includes stringent margin requirements, capital adequacy of members, position limits and online monitoring. Client net worth and order genuineness are not CC risk measures.","ref":"4.1.1","level":"easy"},{"q":"The SPAN method of computing margin is used for trades in which segment?","options":["Equity cash segment","Government securities segment","Futures and Options segment","Mutual fund distribution platform"],"answer":2,"why":"CCs use SPAN (a CME product) for real-time initial margin on futures and options portfolios.","ref":"4.1.2","level":"easy"},{"q":"Which of the following statements on record keeping by stock brokers is true?","options":["The sauda book (register of transactions) needs to be kept for only 2 years","Under the SEBI (Stock Broker) Regulations, 2026, books of account and records must be preserved for at least eight years","Members' contract books must be kept for 10 years under Rule 15 of SCRR","Records may be destroyed once the exchange has completed its annual inspection"],"answer":1,"why":"Regulation 16 of the SEBI (Stock Broker) Regulations, 2026 requires books and records maintained under Regulation 15 to be preserved for a minimum of eight years.","ref":"4.2","level":"medium"},{"q":"How often must brokers send a Global Statement to their clients?","options":["Monthly","Quarterly","Half-yearly","Annually"],"answer":3,"why":"SEBI's letter of November 27, 2017 requires an Annual Global Statement, issued within 30 days from the end of the financial year.","ref":"4.2.3","level":"easy"},{"q":"Cash and cash equivalents must make up at least what share of a member's liquid assets?","options":["25%","50%","75%","90%"],"answer":1,"why":"Cash equivalents must be at least 50% of liquid assets; other liquid assets above the cash-equivalent amount are not counted.","ref":"4.1.1.2","level":"easy"},{"q":"A market-wide index movement of what size halts trading for the rest of the day, whatever the time of breach?","options":["10%","15%","20%","25%"],"answer":2,"why":"A 20% movement in Sensex or Nifty 50 halts trading for the remainder of the day at any time. A 10% or 15% breach halts trading for a limited period if it happens early in the day.","ref":"4.1.1.7","level":"easy"},{"q":"In the equity cash segment, which margin is collected upfront along with ELM?","options":["Mark to market margin","SPAN margin","Delivery margin","VaR margin"],"answer":3,"why":"In the cash segment, TMs/CMs must collect VaR margin and ELM upfront. MTM is collected later, and SPAN is the derivatives method.","ref":"4.1.1","level":"easy"},{"q":"A stock enters the ban period, in which members and clients may only reduce positions, once market-wide open interest exceeds what share of its MWPL?","options":["95%","90%","80%","85%"],"answer":0,"why":"Once market-wide OI in a scrip exceeds 95% of MWPL, positions can only be decreased through offsetting trades.","ref":"4.1.2.4","level":"easy"},{"q":"Monthly expiries fall on the 29th (current), 30th (next) and 31st (far). On the 29th, which calendar spread position still gets calendar spread margin treatment?","options":["A spread between the 29th and 30th contracts","A spread between the 29th and 31st contracts","None. All calendar spread benefit is withdrawn on any expiry day","A spread between the 30th and 31st contracts"],"answer":3,"why":"SEBI's February 05, 2026 clarification withdraws the benefit only for spreads involving the contract expiring that day. A 30th/31st spread keeps its treatment on the 29th.","ref":"4.1.2.1","level":"medium"},{"q":"Why did SEBI decide that calendar spread benefit will not be available on expiry day for contracts expiring that day?","options":["To increase transaction charges collected by exchanges","Because of significant basis risk and very large expiry-day volumes","Because calendar spreads are not permitted in index derivatives","Because SPAN cannot value far-month contracts on expiry day"],"answer":1,"why":"On expiry day the expiring contract can move very differently from later expiries (basis risk), and volumes are very large compared to other days.","ref":"4.1.2.1","level":"medium"},{"q":"True or False: According to SEBI's circular of February 05, 2026, margin calculations for all calendar spread positions change on an expiry day, whichever contracts they involve.","options":["True","False"],"answer":1,"why":"False. Existing calendar spread margin calculations stay unchanged for all expiries except contracts expiring on that given day.","ref":"4.1.2.1","level":"easy"},{"q":"For a trade not covered by the margin trading facility, what happens to securities the client has not fully paid for at the time of pay-out?","options":["They are transferred to the client's demat account and auto-pledged to the TM's CUSPA with reason 'unpaid'","They are kept in the TM's pool account until the client pays","They are pledged by the TM with a bank to fund the client's shortfall","They are returned to the clearing corporation for auction"],"answer":0,"why":"Unpaid securities are paid out directly to the client's demat account, followed by an auto-pledge (no client instruction needed) in favour of the Client Unpaid Securities Pledgee Account.","ref":"4.2.2","level":"medium"},{"q":"If a pledge on unpaid securities is neither invoked nor released within five trading days after pay-out, what happens?","options":["The TM may keep the pledge indefinitely until the client pays","The depository automatically invokes the pledge and sells the shares","The depositories automatically release the pledge at the end of the sixth trading day after pay-out","The securities move to the TM's proprietary demat account"],"answer":2,"why":"The depositories auto-release the pledge at the end of the sixth trading day after pay-out, and the securities become free balance for the client.","ref":"4.2.2","level":"medium"},{"q":"A stock pledged to the CUSPA is stuck in a lower circuit with only sellers, so the TM cannot sell it within 5 trading days. What may the TM do?","options":["Transfer it to its own demat account and sell it later","Request, by 6 p.m. on the fifth trading day after pay-out, an extension of the pledge for one additional calendar week","Request, by 6 p.m. on the sixth trading day, an extension for one more month","Re-pledge the stock to an NBFC until the circuit opens"],"answer":1,"why":"In exceptional cases like a lower circuit, suspension or other valid reasons, the TM may seek a one-calendar-week extension by 6 p.m. on the fifth trading day after pay-out, and must inform the client.","ref":"4.2.2","level":"hard"},{"q":"Which of the following is NOT permitted for securities pledged to a TM's CUSPA?","options":["Considering them for reporting client margin collection to the CC","Selling them in the market under the client's UCC after invocation","Releasing the pledge on excess securities on or before the next trading day","Pledging them to banks/NBFCs to raise funds"],"answer":3,"why":"CUSPA securities cannot be pledged or transferred to banks/NBFCs. They may count for margin reporting and can be sold under the client's UCC after invocation.","ref":"4.2.2","level":"medium"},{"q":"True or False: Unpaid securities pledged to a TM's CUSPA may be counted for reporting client margin collection, and the TM may also give the client trading exposure against them.","options":["True","False"],"answer":1,"why":"False. They may be counted for margin reporting to the CC, but the TM shall not provide any exposure to the client against them.","ref":"4.2.2","level":"hard"},{"q":"What is the minimum VaR margin rate for a Group II (less liquid) security?","options":["21.5%","9%","50%","6%"],"answer":0,"why":"Group II VaR is based on 6σ subject to a minimum of 21.5%. 9% is the Group I floor and 6% is the floor for broad-based index ETFs.","ref":"4.1.1.1","level":"medium"},{"q":"At day end, a broker's clients show MTM results of: Client A −₹900, Client B −₹1,100, Client C +₹1,400. How much MTM must the broker deposit with the CC?","options":["₹600","₹2,000","₹3,400","Nil"],"answer":1,"why":"MTM is grossed across clients and only losses are added: ₹900 + ₹1,100 = ₹2,000. Client C's profit is not set off.","ref":"4.1.1.1","level":"medium"},{"q":"In the same settlement, Client P has a net buy position of ₹2,100 in Security X and Client Q a net sell position of ₹100 in Security X. What gross open position does the CC use for the member's VaR margin in X?","options":["₹2,000","₹2,100","₹2,200","₹100"],"answer":2,"why":"Positions are netted within each client and grossed across clients: ₹2,100 + ₹100 = ₹2,200.","ref":"4.1.1.1","level":"hard"},{"q":"In a cash market purchase, which combination of margins together cannot exceed the purchase value?","options":["VaR margin and ELM only, with MTM levied over and above","VaR margin, ELM and MTM losses together","ELM and MTM only","There is no cap on margins for a purchase"],"answer":1,"why":"For a buy, VaR + ELM + MTM together cannot exceed the purchase value. For a sale, the cap covers only VaR + ELM, and MTM is levied in addition.","ref":"4.1.1.1","level":"hard"},{"q":"If a custodian rejects an institutional trade, on whom are the margins levied?","options":["The custodian","The institutional investor directly","The member who executed the trade","The Core Settlement Guarantee Fund"],"answer":2,"why":"Margins on custodian-confirmed institutional trades are levied on the custodian. On rejected or unaccepted trades they are levied on the executing member.","ref":"4.1.1.2","level":"medium"},{"q":"What is the BMC deposit for a stock broker doing both proprietary and client trading, without algorithmic trading?","options":["₹10 lakh","₹15 lakh","₹50 lakh","₹25 lakh"],"answer":3,"why":"BMC: ₹10 lakh (prop only), ₹15 lakh (clients only), ₹25 lakh (both, no algo), ₹50 lakh (any broker with algo).","ref":"4.1.1.3","level":"medium"},{"q":"A stock broker in risk reduction mode returns to normal risk management mode when its collateral utilisation falls below:","options":["90%","80%","75%","85%"],"answer":3,"why":"RRM starts at 90% utilisation, and the broker moves back to normal mode when utilisation is below the CC's level, currently 85%.","ref":"4.1.1.8","level":"easy"},{"q":"Which of these orders will NOT be accepted from a stock broker in risk reduction mode?","options":["Non-margined orders","Orders that reduce the open position","Immediate or Cancel orders","Fresh orders backed by sufficient margin"],"answer":0,"why":"In RRM only IOC orders are allowed, risk-reducing orders are accepted and new orders are checked for margin, but non-margined orders are not accepted at all.","ref":"4.1.1.8","level":"medium"},{"q":"What is the minimum liquid net worth a clearing member must maintain at all times?","options":["₹25 lakh","₹50 lakh","₹1 crore","₹10 lakh"],"answer":1,"why":"Liquid net worth (liquid assets minus initial margin and ELM) must never fall below ₹50 lakh.","ref":"4.1.2.2","level":"easy"},{"q":"If a physically settled derivative contract expires on a Thursday, from when do delivery margins on potential in-the-money long options apply?","options":["From the previous Friday EOD (four days before expiry)","From the Wednesday before expiry","Only on expiry day","From T+1 after expiry"],"answer":0,"why":"Delivery margins start four days before expiry; the workbook's example is a Thursday expiry, with margins from the previous Friday EOD.","ref":"4.1.2.1","level":"medium"},{"q":"On options expiry day, what additional ELM is levied on short index options expiring that day?","options":["1%","3.5%","2%","5%"],"answer":2,"why":"To raise tail-risk cover on expiry day, an additional 2% ELM applies on short index options expiring that day, both those open at day start and those written during the day.","ref":"4.1.2.1","level":"medium"},{"q":"Under cross margining, what spread margin applies to offsetting positions in correlated indices with different expiry dates?","options":["25%","30%","35%","40%"],"answer":3,"why":"Correlated indices: 30% with the same expiry, 40% with different expiries. 35% applies to an index against its constituents with a different expiry, and 25% to the basic eligible offsets.","ref":"4.1.2.1","level":"hard"},{"q":"Under the peak margin framework, which shortfall is used to levy the penalty on a TM/CM?","options":["The sum of the EOD shortfall and the peak shortfall","Only the EOD shortfall","The higher of the EOD shortfall and the peak shortfall","The average shortfall across all snapshots"],"answer":2,"why":"EOD obligation is compared with EOD margin available and peak obligation with peak margin available; the higher of the two shortfalls is penalised.","ref":"4.1.4","level":"medium"},{"q":"When a trade comes from a client account, in what order does the CC block margin?","options":["Client collateral, then TM proprietary collateral, then CM proprietary collateral","CM proprietary collateral, then TM proprietary collateral, then client collateral","TM proprietary collateral, then client collateral, then CM proprietary collateral","Client collateral, then CM proprietary collateral, then TM proprietary collateral"],"answer":0,"why":"Margin is first blocked from the client's collateral, then from the TM's proprietary collateral, and finally from the CM's proprietary collateral.","ref":"4.1.5","level":"medium"},{"q":"Within what time must a Suspicious Transaction Report (STR) be filed with FIU-IND?","options":["By the 15th of the succeeding month","Within 7 days of arriving at a conclusion that the transaction is suspicious","Within 30 days of the transaction","Within 24 hours of the transaction"],"answer":1,"why":"STR is due within 7 days of concluding that a transaction is suspicious. CTR and NTR are monthly, due by the 15th of the next month.","ref":"4.2.5","level":"easy"},{"q":"If a client has authorised a running account, what is the maximum gap between two settlements of the client's funds?","options":["90 days (quarterly) or 30 days (monthly), as the client chooses","60 days or 15 days","180 days or 90 days","One year"],"answer":0,"why":"The client chooses quarterly or monthly settlement, so the gap can be at most 90 or 30 days.","ref":"4.2.2","level":"easy"},{"q":"What is the clearing corporation's minimum contribution to the Core SGF?","options":["25% of MRC","Not more than 25% of MRC","At least 50% of MRC, from its own funds","100% of MRC"],"answer":2,"why":"The CC contributes at least 50% of the MRC from its own funds, the stock exchange at least 25%, and all clearing members together not more than 25%.","ref":"4.3.2","level":"easy"},{"q":"In the default waterfall, which resource is used first?","options":["Insurance, if any","Penalties in the Core SGF","CC resources equal to 5% of the segment MRC","Monies of the defaulting member, including its Core SGF contribution and excess monies in other segments"],"answer":3,"why":"The defaulter's own monies come first, then insurance, then CC resources of 5% of segment MRC, then the Core SGF (penalties first).","ref":"4.3.3","level":"medium"},{"q":"In the derivatives segment, what is the maximum capped additional contribution by a non-defaulting member to cover a default?","options":["Lower of 2 times its primary contribution or 20% of the segment's Core SGF","Lower of 2 times its primary contribution or 10% of the segment's Core SGF","3 times its primary contribution","There is no cap"],"answer":0,"why":"Derivatives segment: lower of 2× primary contribution or 20% of Core SGF on the date of default. Equity/debt segments use 10% instead of 20%.","ref":"4.3.3","level":"hard"}]},{"id":5,"title":"Clearing Process","short":"Clearing","weight":15,"minutes":30,"big_picture":"Clearing is the 'who owes what to whom' step between the trade and the settlement. Think of a busy wedding where nobody settles bills with each other: everyone pays the caterer's cashier, who nets it all down to a few final transfers and promises nobody gets stiffed. The clearing corporation is that cashier for the stock market: it becomes buyer to every seller and seller to every buyer (novation), nets everything, and hands the final obligations to clearing members, custodians, clearing banks and depositories to settle on T+1.","exam_focus":["Novation and the clearing corporation's roles as central counterparty and settlement guarantor","The T to T+1 clock: CP code 4:15 pm, OTR 8:00 pm, custodial confirmation 7:30 am, obligations 9:00 am, pay-in about 11:00 am, funds pay-out 1:30 pm, securities pay-out 3:30 pm","Interoperability: one active CC per segment, what is excluded, the two parts of inter-CC collateral","Pool accounts, clearing bank accounts, DIS/DDPI, block mechanism and validation of pay-in instructions","Institutional trades: custodian and CP code, INST, no day trading, margin on T+1, DVP if rejected","Multilateral netting arithmetic and derivatives open-position calculation (clients never netted)","Optional T+0: 9:15 am to 1:30 pm, ±100 bps band re-calibrated every 50 bps, no auction (close-out 10% above the day's high)"],"sections":[{"id":"5.1","title":"Introduction: T+1 Clearing and Optional T+0","blocks":[{"type":"p","text":"Clearing answers one question: <b>who must deliver which shares, and who must pay how much?<\/b> Settlement then moves them. SEBI's circular of <b>September 7, 2021<\/b> introduced optional T+1; after a phased roll-out, <b>all equity trades now settle on T+1<\/b>, so pay-in and pay-out of funds and securities both happen on T+1."},{"type":"steps","items":[{"title":"T day, after close","text":"Exchange sends all trade details to the clearing corporation (CC)."},{"title":"T day, up to 4:15 pm","text":"Custodial Participant (CP) code can be modified."},{"title":"T day, time set by CC","text":"\"INST\" trades are allocated."},{"title":"T day","text":"CC groups trades by clearing member/custodian and informs each of its clients' trades."},{"title":"T+1, by 7:30 am","text":"Clearing members/custodians confirm institutional/CP trades."},{"title":"T+1, by 9:00 am","text":"CC runs multilateral netting and downloads final funds and securities obligations; settlement happens the same day (T+1)."}]},{"type":"table","head":["SEBI circular","What it did"],"rows":[["September 7, 2021","Optional T+1 for cash market (phased roll-out)"],["March 21, 2024","<b>Beta<\/b> optional T+0, alongside T+1: <b>25 scrips<\/b>, limited brokers"],["December 10, 2024","More T+0 scrips; <b>all brokers<\/b> may participate; MIIs/custodians to extend T+0 to institutions; exchanges to set up a Block Deal window under T+0"]]},{"type":"trap","text":"T+0 is <b>optional<\/b> and runs <b>in addition to<\/b> T+1; it did not replace it. The beta had 25 <b>scrips<\/b>, not 25 brokers."}]},{"id":"5.2","title":"Role of the Clearing Corporation","blocks":[{"type":"p","text":"A trade is a contract between buyer and seller; if one defaults, the other loses. After thousands of trades are netted, it is almost impossible to find the original counterparty. So the CC uses <b>novation<\/b>: it becomes <b>buyer to every seller and seller to every buyer<\/b> and guarantees settlement to both. Robust margining ensures it holds enough of a defaulter's money to cover the loss."},{"type":"key","text":"<b>Novation<\/b> (SECC Regulations, 2018): a clearing corporation interposing itself between both parties of every trade, being the legal counterparty to both."},{"type":"hook","text":"Think of a wedding cashier: guests never pay each other; everyone pays the cashier, who pays everyone and guarantees nobody is stiffed."},{"type":"table","head":["Key role","Meaning"],"rows":[["Central Counterparty (CCP)","Buyer to every seller, seller to every buyer"],["Settlement Guarantee","<b>Primary function<\/b>: the trade completes even if one party defaults"],["Risk Management","Controls counterparty and systemic risk"],["Clearing and Netting","Verifies trade details (price, volume) and computes net obligations"],["Securities and Funds Transfer","Funds via <b>clearing banks<\/b>; securities via <b>depositories<\/b> (NSDL, CDSL)"],["Market Efficiency and Transparency","Standardised, guaranteed settlement builds liquidity and confidence"],["Regulatory Compliance and Reporting","Reports data to regulators"],["Member Oversight and Discipline","Monitors members daily; can investigate, hold hearings, penalise or revoke membership"]]},{"type":"p","text":"The clearing function works out (a) what members must <b>deliver<\/b> and (b) what they will <b>receive<\/b> on the settlement date. The CC also handles <b>security shortages, bad delivery, company objections and auction settlement<\/b>, and collects margins. It works with clearing members, clearing banks, custodians and depositories, linked electronically."},{"type":"list","items":["<b>As central counterparty, the CC also:<\/b> gives a <b>'counterparty undertaking'<\/b> on every trade","monitors the market and participants","offers dispute resolution and independent legal enforcement, so buyers and sellers need not sue each other","reduces payments through netting and handles payments not relating to deliveries","can net deliveries at member level (payments are <b>always<\/b> netted)","provides secure, standardised processing and lowers risk for investors","calculates and controls margining"]},{"type":"key","text":"India's cash segment has two CCs: <b>NSE Clearing Limited (NCL)<\/b> and <b>Indian Clearing Corporation Limited (ICCL)<\/b>."},{"type":"p","text":"<b>Interoperability among CCs<\/b> (SEBI circular, November 27, 2018) links CCs so a clearing member can clear trades from <b>multiple exchanges at one CC of its choice<\/b>. Result: efficient capital use, lower cost, better execution."},{"type":"compare","items":[{"title":"Covered","points":["All recognised CCs except those in IFSC","All exchange-traded products, except those listed opposite"]},{"title":"Not covered","points":["CCs in IFSC","Commodity derivatives; Tri-party repo","Offer for Sale, MF Service Scheme, Buyback/Tender Offer, Non-competitive bidding, SGB primary bidding","Securities Lending and Borrowing (SLB)"]}]},{"type":"list","items":["A CM designates one CC per <b>business segment<\/b>, covering all its TMs in that segment.","It may be a member of several CCs but <b>active with only one CC per segment<\/b> at a time; different segments may use different CCs (CM-Segment level).","Custodians choose a designated CC separately for each CP (Custodian-CP-Segment level).","CCs connect through a <b>peer-to-peer link<\/b> under special arrangements, not normal membership rules, with bilaterally approved risk management and reciprocal exchange of margins. Each holds enough collateral that a default by one CC causes no loss to the other.","Inter-CC collateral: (a) <b>margins<\/b> as per SEBI's framework (IM, ELM, calendar spread etc.) + (b) <b>additional capital<\/b> based on the linked CC's credit risk, on which no exposure is given."]},{"type":"p","text":"<b>Benefits:<\/b> choice of CC, better capital use, less trading disruption, lower aggregate exposure, less operational complexity, more competition and lower clearing cost, and execution risk decoupled from settlement risk (an 'arm's length' relationship between exchange and CC)."},{"type":"trap","text":"Membership of more than one CC: allowed. <b>Active<\/b> with more than one CC in the <b>same segment<\/b>: not allowed. And a CC does not run the trading platform or create securities."}]},{"id":"5.3","title":"Clearing Banks and their Function","blocks":[{"type":"p","text":"Clearing banks are the money pipe between clearing members and the CC. Every CM keeps an account with an <b>empanelled clearing bank<\/b> at designated branches, used <b>only<\/b> for clearing and settlement. The CC sends pay-in details; the bank debits paying members. On the CC's pay-out instruction, it credits receiving members. Clearing banks must offer the minimum services specified by the CC."},{"type":"hook","text":"Depositories move the shares, clearing banks move the money, and the CC tells both what to do."}]},{"id":"5.4","title":"Clearing Members and Custodians","blocks":[{"type":"p","text":"Clearing members are of three types: <b>PCM<\/b> (professional), <b>TCM<\/b> (trading-cum-clearing) and <b>SCM<\/b> (trading-cum-self-clearing). Each takes CC membership and a unique member ID. <b>Custodians are clearing members but not trading members<\/b>: they settle institutional clients' trades executed through other brokers."},{"type":"list","items":["<b>Functions:<\/b> Clearing (computing obligations of their TMs); Settlement; Risk management (limits based on deposits/margins, continuous monitoring); Confirmation of CP trades."]},{"type":"compare","items":[{"title":"Pool account (demat)","points":["Mandatory with <b>both<\/b> NSDL and CDSL, via a DP","Delivers securities to the CC for pay-in and receives pay-out","CM has <b>no ownership or beneficial rights<\/b>; corporate benefits received are passed on","Clients can transfer shares straight into it"]},{"title":"Clearing bank account","points":["Separate, distinct account with the designated clearing bank","For funds obligations, margins, collateral release/enhancement, early pay-in of funds, penal charges","Irrevocable authority to the bank to act on CC instructions","Deposit in any form; <b>withdraw only in self-name<\/b>; extra accounts allowed for cash collateral and EPI"]}]},{"type":"p","text":"The CC sends each CM details of its members' and clients' trades; the CM confirms genuineness. Custodian trades carry a <b>CP code<\/b> and need the custodian's confirmation. Only then does the CC run multilateral netting."}]},{"id":"5.5","title":"Depositories and Depository Participants","blocks":[{"type":"p","text":"A <b>depository<\/b> holds securities electronically and transfers them by book entry, quickly and safely, on the account holder's instruction. It serves clients through <b>Depository Participants (DPs)<\/b>. Buyer and seller each need a demat account with a DP of either depository."},{"type":"list","items":["Transferor gives a delivery instruction; transferee gives a <b>Receipt Instruction<\/b> each time, or a one-time <b>Standing Instruction (SI)<\/b>.","Transfers arise from: (a) <b>off-market<\/b> deals (not on a recognised exchange), (b) exchange trades, (c) transmission and account closure.","A demat account is debited only on a <b>Delivery Instruction Slip (DIS)<\/b>, marked market/off-market, complete, signed by <b>all<\/b> holders; an 'execution date' allows a future-dated debit. e-DIS is also available.","<b>DDPI<\/b> (Demat Debit and Pledge Instruction): client authorises the broker to debit the BO account only to meet pay-in obligations. Same purpose as PoA, far less misuse."]},{"type":"steps","items":[{"title":"Seller to broker pool","text":"Seller instructs his DP (or broker uses DDPI/valid PoA) to move shares to the broker's pool account."},{"title":"Broker pool to CC pool","text":"Delivery-out instruction; CCs and depositories validate first."},{"title":"Pay-out","text":"Since SEBI's <b>June 05, 2024<\/b> circular, the CC credits shares <b>directly to the buyer's demat account<\/b>."},{"title":"Custodian clients","text":"Direct pay-out does not apply; shares go to the buying broker's pool, then to the buyer's account."}]},{"type":"trap","text":"The seller instructs his <b>Depository Participant<\/b>, not the clearing bank or the CC."}]},{"id":"5.6","title":"Clearing Process","blocks":[{"type":"p","text":"Clearing <b>determines<\/b> obligations; settlement <b>discharges<\/b> them. Through <b>multilateral netting<\/b> each CM ends up with either a pay-in or a pay-out, separately for funds and securities. The clearing agency guarantees every contract. Some transactions/securities settle <b>gross (trade-for-trade)<\/b>, with no netting."},{"type":"steps","items":[{"title":"Obligations","text":"Trade data comes from the exchange; after custodial confirmation the CC fixes obligations and downloads them with pay-in advice."},{"title":"Members prepare","text":"Delivering member moves shares to the CM Clearing Pool Account; paying member keeps clear funds in the clearing bank account, before the CC's deadline."},{"title":"Pay-in","text":"CC tells depositories to debit CM/custodian pool accounts and credit its own; tells clearing banks to debit CM/custodian accounts and credit its own."},{"title":"Pay-out","text":"Securities: direct to client demat (not custodian clients). Funds: clearing banks credit CMs/custodians and debit the CC."}]},{"type":"key","text":"Buy-side and sell-side clearing members are different; the CC is the link between them."}]},{"id":"5.6.1","title":"Settlement of Institutional Transactions","blocks":[{"type":"p","text":"Institutional investors: <b>Category I FPIs<\/b> and <b>Category II FPIs that are not corporate bodies, family offices or individuals<\/b> (SEBI FPI Regulations, 2019), SEBI-registered <b>mutual funds<\/b>, public financial institutions, banks, insurance companies and pension funds."},{"type":"list","items":["Must settle through a <b>custodian<\/b>, using a <b>CP code<\/b> obtained from the CC via the custodian; CP code is mandatory at order entry. It lets an institution trade through many brokers but settle with one custodian.","All trades go through <b>Straight Through Processing (STP)<\/b>; electronic contract note in SEBI format to custodian/institution; workflow per SEBI circular of June 10, 2004.","Brokers may enter <b>\"INST\"<\/b> as the CP code and allocate later, only to eligible institutions, within the CC's time. For FPIs that are corporate bodies, individuals or family offices, INST trades go only to <b>related FPIs<\/b>."]},{"type":"table","head":["Rule","Institutional investor"],"rows":[["Day trading","<b>Not allowed<\/b>"],["Obligations","<b>Gross<\/b> at custodian level; custodian settles <b>net<\/b> with the exchange"],["Short selling","Allowed; <b>naked<\/b> short selling not allowed"],["Margin","No upfront margin; levied on <b>T+1<\/b> after custodian confirmation. Exception: Cat II FPIs that are corporate bodies/individuals/family offices and domestic entities using custodians pay <b>upfront<\/b>"],["Custodian rejects trade","Settled on <b>DVP<\/b> basis, with penalties"]]},{"type":"table","head":["When","Activity"],"rows":[["T, up to 4:15 pm","Modify CP code"],["T, up to 8:00 pm","Obligation Transfer Request (OTR) for INST trades"],["T+1, up to 7:30 am","Custodial confirmation"],["T+1, up to 9:00 am","Final obligation to custodian"],["T+1, around 11:00 am","Funds/securities pay-in (margins/early pay-in as per regular procedure)"],["T+1, 1:30 pm / by 3:30 pm","Funds pay-out / securities pay-out"],["Within 24 hours of receipt","Custodian processes settlement"]],"caption":"Custodian-settled trades under T+1"},{"type":"hook","text":"The clock: <b>4:15, 8:00<\/b> on T evening (codes, OTR), then <b>7:30, 9:00, 11:00, 1:30, 3:30<\/b> on T+1 (confirm, obligations, pay-in, money out, shares out)."},{"type":"p","text":"Non-institutional clients can also get a CP code and use a PCM/custodian; confirmed trades become that CM's obligation, including margins, penalties and levies."}]},{"id":"5.6.2","title":"Block Mechanism for Selling Clients","blocks":[{"type":"p","text":"Instead of moving shares out for early pay-in (and back if the order fails), shares are <b>blocked in the client's own demat account in favour of the CC<\/b> (SEBI circulars, July 2021 to October 2022)."},{"type":"steps","items":[{"title":"Block","text":"Client blocks via the depository's online system/e-DIS, or via DP on physical DIS or PoA."},{"title":"Hold","text":"Block can stay till pay-in day; depositories pass UCC, TM ID, Exchange ID to the CC."},{"title":"Match on T day","text":"CC sends client-level net obligations on T day; matching on UCC, TM ID, CM ID, Exchange ID. If matched, CC gives <b>EPI benefit<\/b>; shares move only against the obligation."},{"title":"Release","text":"Unmatched: CC uploads cancellation on T day, shares freed same day. Sale not executed: unblocked at <b>end of T day<\/b>."}]},{"type":"list","items":["No unblocking by broker or client once EPI benefit is given.","<b>Mandatory for all early pay-in (EPI)<\/b>; not applicable to clients of SEBI-registered custodians."]},{"type":"hook","text":"Blocking is reserving a table, not moving house: shares leave only if the sale happens."}]},{"id":"5.6.3","title":"Validation of Pay-In Instructions","blocks":[{"type":"p","text":"Before moving shares from a client's demat to the TM pool account, the depository checks the instruction (online, eDIS, DIS, PoA or DDPI) against the <b>client-wise net delivery obligation<\/b> sent by CCs on <b>T day<\/b>, matching UCC, TM ID, CM ID, Exchange ID, ISIN, quantity and settlement details (SEBI circular, September 19, 2022). Not applicable to custodian clients."},{"type":"table","head":["Situation","Result"],"rows":[["All details match","Executed: client debited, linked TM pool credited on or before settlement day"],["Mismatch in UCC, TM ID, CM ID, ISIN etc.","<b>Rejected<\/b>"],["Quantity <b>less<\/b> than obligation","Carried out"],["Quantity <b>more<\/b> than obligation","<b>Partially<\/b> processed, up to obligation"]]},{"type":"example","title":"Ravi's 100 shares","text":"Obligation 100. Instruction for 150: only 100 move. Instruction for 80: 80 move. Wrong ISIN: rejected."}]},{"id":"5.6.4","title":"Clearing Process for Derivatives","blocks":[{"type":"p","text":"Derivatives clearing works out <b>open positions<\/b> (outstanding long or short positions), which drive exposure and daily margins. CM position = sum of all its TMs and CPs. TM position = proprietary + clients (flagged by the <b>pro/cli indicator<\/b>). A contract is defined by future/option, underlying, expiry, option type and strike."},{"type":"key","text":"Proprietary: net per contract. Each client: net per contract. <b>Never netted across clients.<\/b> TM open position = proprietary open position + client open longs + client open shorts."},{"type":"table","head":["TM","Proprietary (B / S / net)","Client 1","Client 2","Open position"],"rows":[["PQR","5000 / 3000 / +2000","3000 / 2000 / +1000","3000 / 1000 / +2000","Long 5000"],["XYZ","1000 / 2000 / (1000)","2000 / 1000 / +1000","3000 / 4000 / (1000)","Long 1000, Short 2000"]],"caption":"Clearing member A, Index May futures"},{"type":"example","title":"Working it out","text":"XYZ: client 1 long 1000; proprietary short 1000 + client 2 short 1000 = short 2000. CM A = <b>long 6000, short 2000<\/b>."},{"type":"trap","text":"'XYZ net short 1000' is the classic wrong answer: clients are not netted against each other or against proprietary."},{"type":"p","text":"All derivatives (index/stock F&O, currency F&O, interest rate futures and options) settle in cash or by physical delivery (Chapter 6). <b>Custodial participants<\/b> register with the CC through their CM; trades the CM confirms become its obligations, including margins, penalties and levies."},{"type":"p","text":"<b>Net settlement of Cash and F&O on stock derivative expiry<\/b> (SEBI, November 30, 2022): cash segment obligations and <b>physical settlement<\/b> F&O obligations are settled <b>net<\/b>, aligning segments and cutting price risk."},{"type":"list","items":["Only for the <b>same TM-CM combination<\/b> in both segments.","<b>Not for institutional investors<\/b>, including all FPIs (their cash trades must be delivery-backed).","<b>STT and stamp duty<\/b> remain segment-wise."]},{"type":"example","title":"Box 5.1","text":"Long ITM put, strike ₹110, settlement price ₹100; same stock bought in cash market on expiry day at ₹101.<br>Separately: pay ₹101, receive shares, deliver them in F&O, receive ₹110, with margins on both.<br>Netted: <b>net pay-out of ₹9<\/b>, no securities movement, no margin after expiry."}]},{"id":"5.6.5","title":"Netting of Clients' Accounts within the Broker","blocks":[{"type":"p","text":"Brokers may net each client's trades within the firm at day-end; the final pay-in/pay-out for that client goes through clearing banks and depository participants. The CC then nets brokers against each other (5.6.6)."}]},{"id":"5.6.6","title":"Broker Netting with the Clearing Corporation: Worked Example","blocks":[{"type":"p","text":"Each day the CC sends members their trade lists, runs <b>multilateral netting<\/b>, and tells each what to pay/deliver and receive. Workbook example, security ABC:"},{"type":"table","head":["Trade","Buyer","Seller","Qty","Price (₹)","Value (₹)"],"rows":[["1","X","Y","200","10.00","2,000"],["2","Y","Z","50","10.50","525"],["3","X","Z","100","10.50","1,050"],["4","Y","X","300","11.00","3,300"]]},{"type":"table","head":["Broker","Bought / Sold","Net shares","Net funds (₹)","Final obligation"],"rows":[["X","300 / 300","0","-2,000 - 1,050 + 3,300 = +250","Receive ₹250"],["Y","350 / 200","+150","+2,000 - 525 - 3,300 = -1,825","Receive 150 shares, pay ₹1,825"],["Z","0 / 150","-150","+525 + 1,050 = +1,575","Deliver 150 shares, receive ₹1,575"],["Total","","150 in = 150 out","1,825 in = 1,825 out","Always balances"]]},{"type":"hook","text":"Gross: 4 share movements (650 shares) and 4 payments (₹6,875). Netted: one delivery of 150 shares and ₹1,825 each way. Less movement, less money, less risk."}]},{"id":"5.7","title":"Optional T+0 Rolling Settlement Cycle","blocks":[{"type":"table","head":["Feature","T+0 rule"],"rows":[["Eligible investors","All, if they meet MII timelines, process and risk requirements"],["Trading hours","One continuous session, <b>9:15 am to 1:30 pm<\/b>"],["Price band","<b>±100 bps<\/b> from the T+1 market price; re-calibrated after every <b>50 bps<\/b> move in T+1"],["Netting with T+1","<b>None<\/b>"],["Not available","Pre-open, special pre-open, auction, periodic call auction, post-close session"],["Block window","Only <b>1<\/b>"],["Securities pay-in","Only as <b>early pay-in via block mechanism<\/b>"],["Shortage","<b>No auction<\/b>; closed out at <b>10% above the day's highest price<\/b> across all exchanges"],["No T+0 trading","Ex-date of securities, settlement holidays, etc."],["T+0 prices","Not used for index or settlement price computation"],["Pay-in (non-custodial)","Around <b>1:45 pm<\/b>"]]},{"type":"hook","text":"T+0 = same-day, no frills: one session, one block window, no auction, no netting with T+1, shares pre-blocked."},{"type":"trap","text":"±100 bps is the band; 50 bps is the re-calibration trigger. And the T+0 close-out is 10% above the day's <b>high<\/b>, not the 20% rule of normal close-outs."}]}],"numbers":[{"fact":"Settlement cycle for all equity cash trades","value":"T+1 (pay-in and pay-out on T+1)","ref":"5.1"},{"fact":"SEBI circular introducing optional T+1","value":"September 7, 2021","ref":"5.1"},{"fact":"Modification of CP code","value":"T day, up to 4:15 pm","ref":"5.1"},{"fact":"Obligation Transfer Request (OTR) for INST trades","value":"T day, up to 8:00 pm","ref":"5.6.1"},{"fact":"Custodial confirmation of institutional trades","value":"T+1, by 7:30 am","ref":"5.1"},{"fact":"Final obligations downloaded to CMs/custodians","value":"T+1, by 9:00 am","ref":"5.1"},{"fact":"Funds/securities pay-in (custodian trades)","value":"T+1, around 11:00 am","ref":"5.6.1"},{"fact":"Funds pay-out","value":"T+1, 1:30 pm","ref":"5.6.1"},{"fact":"Securities pay-out","value":"T+1, by 3:30 pm","ref":"5.6.1"},{"fact":"Custodian's settlement processing","value":"Within 24 hours of receipt of cash/securities","ref":"5.6.1"},{"fact":"Optional T+0 beta launched","value":"SEBI circular March 21, 2024","ref":"5.1"},{"fact":"Scrips in T+0 beta","value":"25 (with a limited number of brokers)","ref":"5.1"},{"fact":"T+0 expanded; all brokers allowed","value":"SEBI circular December 10, 2024","ref":"5.1"},{"fact":"Clearing corporations in cash segment","value":"2: NCL and ICCL","ref":"5.2"},{"fact":"Novation defined in","value":"SECC Regulations, 2018","ref":"5.2"},{"fact":"Interoperability among CCs circular","value":"November 27, 2018","ref":"5.2"},{"fact":"Active CCs per business segment for a CM","value":"Only 1 at a time","ref":"5.2"},{"fact":"Components of inter-CC collateral","value":"2: margins (IM, ELM, calendar spread etc.) + additional capital","ref":"5.2"},{"fact":"Benefits of interoperability listed","value":"7","ref":"5.2"},{"fact":"Types of clearing members","value":"3: PCM, TCM, SCM","ref":"5.4"},{"fact":"Depositories where CM pool accounts are mandatory","value":"Both: NSDL and CDSL","ref":"5.4"},{"fact":"Purposes of transfer between demat accounts","value":"3: off-market, exchange trade, transmission/account closure","ref":"5.5"},{"fact":"Direct pay-out of securities to client demat","value":"SEBI circular June 05, 2024","ref":"5.5"},{"fact":"FPI regulations referred for institutional investors","value":"SEBI FPI Regulations, 2019","ref":"5.6.1"},{"fact":"Institutional transaction workflow circular","value":"June 10, 2004","ref":"5.6.1"},{"fact":"Margin on institutional trades","value":"On T+1, after custodian confirmation (no upfront margin)","ref":"5.6.1"},{"fact":"Block mechanism circulars","value":"July 16, 2021; August 18, 2022; October 27, 2022","ref":"5.6.2"},{"fact":"Unexecuted sale: blocked shares released","value":"End of T day","ref":"5.6.2"},{"fact":"CC sends client-level net obligations to depositories","value":"T day","ref":"5.6.3"},{"fact":"Validation of pay-in instructions circular","value":"September 19, 2022","ref":"5.6.3"},{"fact":"Net settlement of cash and F&O on stock derivative expiry","value":"SEBI circular November 30, 2022","ref":"5.6.4"},{"fact":"Box 5.1 net pay-out (put strike ₹110, cash buy ₹101)","value":"₹9","ref":"5.6.4"},{"fact":"Workbook derivatives example: CM A open position","value":"Long 6000, Short 2000","ref":"5.6.4"},{"fact":"Workbook netting example: Broker Y","value":"Receive 150 shares, pay ₹1,825","ref":"5.6.6"},{"fact":"Workbook netting example: Broker Z","value":"Deliver 150 shares, receive ₹1,575","ref":"5.6.6"},{"fact":"Workbook netting example: Broker X","value":"No shares, receive ₹250","ref":"5.6.6"},{"fact":"T+0 trading session","value":"9:15 am to 1:30 pm (one continuous session)","ref":"5.7"},{"fact":"T+0 price band","value":"±100 bps from the T+1 market price","ref":"5.7"},{"fact":"T+0 price band re-calibration","value":"After every 50 bps move in the T+1 market","ref":"5.7"},{"fact":"Block session windows in T+0","value":"1","ref":"5.7"},{"fact":"T+0 shortage close-out price","value":"10% above the highest price of the day across all exchanges","ref":"5.7"},{"fact":"T+0 pay-in (non-custodial)","value":"Around 1:45 pm","ref":"5.7"}],"flashcards":[{"q":"What is novation?","a":"The CC interposes itself between buyer and seller and becomes the legal counterparty to both."},{"q":"What is the primary function of a clearing corporation?","a":"Guaranteeing final settlement of trades, even if one of the original parties defaults."},{"q":"Name the two clearing corporations in India's cash segment.","a":"NSE Clearing Limited (NCL) and Indian Clearing Corporation Limited (ICCL)."},{"q":"Through whom does the CC move funds and securities?","a":"Funds through clearing banks; securities through depositories (NSDL and CDSL)."},{"q":"What is interoperability among clearing corporations?","a":"Linking CCs so a CM can clear trades from any exchange at one CC of its choice."},{"q":"Under interoperability, with how many CCs can a CM be active per segment?","a":"Only one at a time (membership of more than one is allowed)."},{"q":"Which products are outside interoperability?","a":"Commodity derivatives, tri-party repo, SLB, and schemes like OFS, MFSS, buyback/tender offer, NCB and SGB primary bidding."},{"q":"Two components of inter-CC collateral?","a":"(a) Margins as per SEBI's risk framework (b) additional capital based on the linked CC's credit risk, with no exposure on it."},{"q":"What is a pool account?","a":"The broker's settlement demat account used to deliver to and receive from the CC; broker has no beneficial ownership."},{"q":"Can a CM withdraw money from its clearing account to a third party?","a":"No. Deposits can be in any form, withdrawals only in self-name."},{"q":"What are custodians in clearing?","a":"Clearing members (not trading members) who settle institutional clients' trades executed through other brokers."},{"q":"What is DDPI?","a":"Demat Debit and Pledge Instruction: client lets broker debit the BO account only to meet pay-in obligations; replaces PoA."},{"q":"What is a Standing Instruction (SI)?","a":"A one-time instruction to the DP to accept all incoming credits, so no receipt instruction is needed each time."},{"q":"What is an off-market trade?","a":"A transfer not done on a recognised stock exchange (person to person)."},{"q":"Who must sign a Delivery Instruction Slip?","a":"All holders of the demat account."},{"q":"Direct pay-out of securities: since when and for whom not?","a":"SEBI circular June 05, 2024; not for clients settling through SEBI-registered custodians."},{"q":"Up to when can a CP code be modified?","a":"T day, up to 4:15 pm."},{"q":"Deadline for OTR of INST trades?","a":"T day, up to 8:00 pm."},{"q":"Deadline for custodial confirmation?","a":"T+1 by 7:30 am."},{"q":"By when are final obligations downloaded on T+1?","a":"By 9:00 am."},{"q":"Funds and securities pay-out times on T+1?","a":"Funds at 1:30 pm; securities by 3:30 pm. Pay-in around 11:00 am."},{"q":"Can institutional investors day-trade?","a":"No. Their obligations are grossed at custodian level."},{"q":"When is margin levied on institutional trades?","a":"On T+1 after custodian confirmation; no upfront margin."},{"q":"What happens if a custodian rejects an institutional trade?","a":"It is settled on DVP basis and may attract penalties from exchanges/CCs."},{"q":"Block mechanism: what if the sale is not executed?","a":"Shares stay in the client's demat and are unblocked at the end of T day."},{"q":"Validation: instruction quantity exceeds CC obligation?","a":"Partially processed, up to the obligation quantity."},{"q":"Validation: UCC or ISIN mismatch?","a":"The instruction is rejected by the depository."},{"q":"Formula for a TM's derivatives open position?","a":"Proprietary open position + client open longs + client open shorts (clients never netted against each other)."},{"q":"Who gets net settlement of cash and F&O on stock derivative expiry?","a":"Investors clearing through the same TM-CM combination in both segments; not institutions or FPIs."},{"q":"Under net settlement, how are STT and stamp duty handled?","a":"Still computed, levied and reported segment-wise."},{"q":"T+0 trading hours and price band?","a":"9:15 am to 1:30 pm; ±100 bps of T+1 price, recalibrated every 50 bps."},{"q":"How are T+0 securities shortages handled?","a":"No auction; closed out at 10% above the day's highest price across all exchanges."}],"questions":[{"q":"The process in which the original buyer-seller contract is replaced and the clearing corporation becomes the counterparty to every trade is called:","options":["Execution","Novation","Determination","Guaranteeing"],"answer":1,"why":"Novation is the CC interposing itself between both parties and becoming the legal counterparty to both.","ref":"5.2","level":"easy"},{"q":"Which type of demat account does a broker use to receive shares from selling clients and to deliver shares for settlement?","options":["Pool account","Delivery account","Receipt account","Common account"],"answer":0,"why":"The pool account is the broker's settlement account for delivering to and receiving from the clearing corporation.","ref":"5.4","level":"easy"},{"q":"Which procedure is used to determine the net settlement obligations (delivery/receipt positions) of clearing members?","options":["Novation","Pay-in","Auto netting","Multilateral netting"],"answer":3,"why":"The CC adopts multilateral netting to arrive at each clearing member's net delivery/receipt obligations.","ref":"5.6","level":"easy"},{"q":"Which concept lets market participants consolidate clearing and settlement at a single clearing corporation, irrespective of the exchange on which the trade was executed?","options":["Interconnectivity","Novation","Interoperability","Straight Through Processing"],"answer":2,"why":"Interoperability among CCs lets a CM choose one CC to clear trades done on multiple exchanges.","ref":"5.2","level":"easy"},{"q":"Which of the following is a major role of a clearing corporation?","options":["Providing the trading platform","Creating new securities","Clearing and settlement of trades","Listing of companies"],"answer":2,"why":"The CC clears and settles trades and guarantees settlement; trading platforms are run by exchanges.","ref":"5.2","level":"easy"},{"q":"Under interoperability, a clearing member can be active with how many clearing corporations per business segment at any point of time?","options":["One","Two","Three","No restriction"],"answer":0,"why":"A CM may be a member of several CCs but can be active with only one CC per business segment at a time.","ref":"5.2","level":"easy"},{"q":"The price in the optional T+0 segment operates within a band of plus/minus how many basis points from the price in the regular T+1 market?","options":["50","100","200","500"],"answer":1,"why":"T+0 has a ±100 bps band around the T+1 price; 50 bps is the movement that triggers re-calibration.","ref":"5.7","level":"medium"},{"q":"After a sale, the selling client gives instructions to which entity to transfer securities to the broker's pool account?","options":["Clearing bank","Clearing corporation","Stock exchange","Depository participant"],"answer":3,"why":"The seller instructs his DP (via DIS, e-DIS, DDPI or PoA) to move shares to the broker's pool account.","ref":"5.5","level":"easy"},{"q":"Under T+1 settlement, by what time must custodians confirm institutional (CP) trades?","options":["7:30 am on T+1","9:00 am on T+1","4:15 pm on T day","11:00 am on T+1"],"answer":0,"why":"Custodial confirmation is due by 7:30 am on T+1; obligations follow by 9:00 am.","ref":"5.1","level":"easy"},{"q":"Up to what time on trade day can a Custodial Participant (CP) code be modified?","options":["3:30 pm","4:15 pm","5:00 pm","8:00 pm"],"answer":1,"why":"CP code modification is allowed on T day up to 4:15 pm; 8:00 pm is the OTR deadline for INST trades.","ref":"5.6.1","level":"medium"},{"q":"The Obligation Transfer Request (OTR) for INST trades can be submitted up to:","options":["4:15 pm on T day","7:30 am on T+1","8:00 pm on T day","9:00 am on T+1"],"answer":2,"why":"OTR for INST trades is allowed on T day up to 8:00 pm.","ref":"5.6.1","level":"medium"},{"q":"By what time on T+1 does the clearing corporation complete multilateral netting and download final obligations to clearing members and custodians?","options":["7:30 am","8:30 am","11:00 am","9:00 am"],"answer":3,"why":"Final obligations are determined and downloaded on T+1 by 9:00 am.","ref":"5.1","level":"medium"},{"q":"Which of the following is NOT covered under interoperability among clearing corporations?","options":["Equity cash segment trades","Offer for Sale bids","Equity derivatives","Currency derivatives"],"answer":1,"why":"Order collection schemes such as OFS, MFSS, buyback/tender offer, NCB and SGB primary bidding are excluded, as are commodity derivatives, tri-party repo and SLB.","ref":"5.2","level":"medium"},{"q":"Collateral maintained between interoperable clearing corporations consists of:","options":["Only initial margin","Margins as per the SEBI risk framework plus additional capital based on the linked CC's credit risk","Only the base minimum capital of each CC","An insurance cover bought by each CC"],"answer":1,"why":"Inter-CC collateral has two parts: margins (IM, ELM, calendar spread etc.) and additional capital, on which no exposure is granted.","ref":"5.2","level":"hard"},{"q":"A clearing member's clearing account with the clearing bank allows:","options":["Deposit in any form, withdrawal only in self-name","Deposit and withdrawal only by cheque","Withdrawal to any client on request","Withdrawal to third parties with CC approval"],"answer":0,"why":"Funds can be deposited in any form but withdrawn only in the CM's own name.","ref":"5.4","level":"medium"},{"q":"Under SEBI's direct pay-out framework (June 05, 2024), who credits the purchased securities to the buying client's demat account?","options":["The buying broker","The buyer's DP on request","The clearing corporation directly","The stock exchange"],"answer":2,"why":"CCs credit securities pay-out directly to the client's demat account.","ref":"5.5","level":"easy"},{"q":"Direct pay-out of securities to the client's demat account does NOT apply to:","options":["Retail individual investors","Clients settling through SEBI-registered custodians","HNI clients","Clients with DDPI"],"answer":1,"why":"Clients who have arrangements with SEBI-registered custodians for clearing and settlement are excluded.","ref":"5.5","level":"medium"},{"q":"A client blocks 200 shares for a sale under the block mechanism, but the sell order is never executed. What happens to the shares?","options":["They move to the broker's pool account","They stay blocked till T+1 pay-in","They are unblocked at the end of T day","They are sold in the auction"],"answer":2,"why":"If the sale is not executed, shares remain in the client's account and are unblocked at the end of T day.","ref":"5.6.2","level":"medium"},{"q":"A client's pay-in instruction is for 150 shares but the CC's client-wise net delivery obligation is 100 shares. The depository will:","options":["Reject the instruction","Process all 150 shares","Hold the instruction till the next settlement","Process it partially, up to 100 shares"],"answer":3,"why":"If the instruction quantity exceeds the obligation, it is partially processed up to the obligation quantity.","ref":"5.6.3","level":"medium"},{"q":"If a pay-in instruction's ISIN does not match the obligation data received from the CC, the depository will:","options":["Execute it anyway","Reject the instruction","Process it partially","Refer it to the stock exchange"],"answer":1,"why":"Discrepancies in UCC, TM ID, CM ID, ISIN etc. lead to rejection of the transfer instruction.","ref":"5.6.3","level":"medium"},{"q":"Which statement about institutional investors in the cash segment is correct?","options":["They may day-trade up to a limit","They pay full upfront margin","They are not allowed to day-trade","They must settle through the trading member"],"answer":2,"why":"Institutions cannot square off intra-day; all their transactions are grossed at custodian level and settled through custodians.","ref":"5.6.1","level":"easy"},{"q":"When is margin applicable on institutional trades (other than the excepted categories)?","options":["Upfront at order entry","On T+1 after the custodian confirms the trade","On T+2 at pay-in","Never"],"answer":1,"why":"Institutional trades do not attract upfront margin; margin applies on T+1 after custodian confirmation.","ref":"5.6.1","level":"medium"},{"q":"If a custodian rejects an institutional trade, the trade is:","options":["Settled on Delivery Versus Payment (DVP) basis and may attract penalties","Cancelled by the exchange","Sent to auction","Transferred to another custodian"],"answer":0,"why":"Rejected institutional trades are settled on DVP basis and are subject to penalties imposed by exchanges/CCs.","ref":"5.6.1","level":"medium"},{"q":"A trading member's positions in a stock futures contract: proprietary buy 2,000 and sell 3,000; client A buy 1,500 and sell 500; client B buy 1,000 and sell 2,000. What is the TM's open position?","options":["Net short 1,000","Long 1,000 and short 2,000","Long 4,500 and short 5,500","Long 2,500 and short 2,000"],"answer":1,"why":"Proprietary nets to short 1,000; client A is long 1,000; client B is short 1,000. Clients are not netted, so long 1,000 and short 2,000.","ref":"5.6.4","level":"hard"},{"q":"Brokers A, B and C trade stock PQR: A buys 100 from B at ₹200, B buys 150 from C at ₹202, C buys 50 from A at ₹205. After multilateral netting, what is C's obligation?","options":["Deliver 100 shares and receive ₹20,050","Deliver 150 shares and receive ₹30,300","Receive 50 shares and pay ₹10,250","Deliver 100 shares and pay ₹20,050"],"answer":0,"why":"C sold 150 and bought 50, so delivers 100; it receives ₹30,300 and pays ₹10,250, a net receipt of ₹20,050.","ref":"5.6.6","level":"hard"},{"q":"In the workbook's netting example, Broker X bought 200 shares at ₹10 and 100 at ₹10.50, and sold 300 at ₹11. What is X's net obligation?","options":["Deliver 300 shares and receive ₹3,300","Receive 300 shares and pay ₹3,050","Nothing to deliver or receive; pay ₹250","Nothing to deliver or receive; receive ₹250"],"answer":3,"why":"Bought 300, sold 300, so zero shares; funds = -2,000 - 1,050 + 3,300 = +₹250 receivable.","ref":"5.6.6","level":"medium"},{"q":"An investor holds a long ITM stock put (strike ₹110, settlement price ₹100) and buys the same stock in the cash market on expiry day at ₹101, through the same TM-CM. Under net settlement he will:","options":["Pay ₹101 and then deliver the shares","Receive ₹110 and also receive the shares","Get a net pay-out of ₹9 with no securities movement","Make a net pay-in of ₹9"],"answer":2,"why":"Cash and F&O obligations are netted: he receives ₹110 for the put delivery and owes ₹101 for the purchase, so a net pay-out of ₹9 and no share movement.","ref":"5.6.4","level":"medium"},{"q":"Net settlement of cash segment and physically settled F&O obligations is NOT available to:","options":["Retail clients using the same TM-CM in both segments","HNI clients using the same TM-CM","Proprietary positions of a TM","Institutional investors including all categories of FPIs"],"answer":3,"why":"Institutional investors (including all FPIs) are excluded because their cash market trades must be backed by delivery.","ref":"5.6.4","level":"medium"},{"q":"Under the net settlement mechanism for cash and F&O segments, STT and stamp duty are:","options":["Waived on the netted quantity","Computed only on the net obligation","Computed, levied and reported segment-wise","Paid by the clearing corporation"],"answer":2,"why":"Netting is only for settlement; STT and stamp duty continue to be computed segment-wise.","ref":"5.6.4","level":"medium"},{"q":"What are the trading hours for the optional T+0 settlement segment?","options":["9:15 am to 1:30 pm, one continuous session","9:15 am to 3:30 pm","9:00 am to 11:00 am","1:30 pm to 3:30 pm"],"answer":0,"why":"T+0 has a single continuous trading session from 9:15 am to 1:30 pm.","ref":"5.7","level":"easy"},{"q":"How is a securities shortage handled in the optional T+0 settlement cycle?","options":["Auction on the next day","Close-out at 20% above the closing price","Carried forward to T+1 settlement","Direct close-out at 10% above the highest price of the day across all exchanges"],"answer":3,"why":"No auction is held for T+0 shortages; they are closed out at 10% above the day's highest price across exchanges.","ref":"5.7","level":"medium"},{"q":"Which of the following is available in the optional T+0 segment?","options":["Pre-open session","Post-close session","One block session window","Periodic call auction"],"answer":2,"why":"Only one block window is available; pre-open, special pre-open, auction, periodic call auction and post-close sessions are not.","ref":"5.7","level":"medium"},{"q":"Funds move between the clearing corporation and clearing members through:","options":["Depositories","Clearing banks","Depository participants","Stock exchanges"],"answer":1,"why":"All funds pay-in and pay-out is carried out by clearing banks on the CC's instructions.","ref":"5.3","level":"easy"},{"q":"Which pair are the two clearing corporations in India's cash segment named in the workbook?","options":["NSDL and CDSL","NSE Clearing Limited and Indian Clearing Corporation Limited","NSE and BSE","RBI and SEBI"],"answer":1,"why":"The cash segment CCs are NCL and ICCL; NSDL and CDSL are depositories.","ref":"5.2","level":"easy"},{"q":"Pay-in and pay-out obligations of the T+1 and optional T+0 settlement cycles are netted against each other.","options":["True","False"],"answer":1,"why":"There is no netting of pay-in and pay-out obligations between T+1 and T+0.","ref":"5.7","level":"easy"},{"q":"A clearing member holds no ownership or beneficial rights over the shares lying in its pool account.","options":["True","False"],"answer":0,"why":"Unlike a normal demat account, the CM gets no ownership or beneficiary rights in the pool account; benefits are passed on to beneficiaries.","ref":"5.4","level":"easy"}]},{"id":6,"title":"Settlement Process","short":"Settlement","weight":15,"minutes":40,"big_picture":"If clearing works out the bill, settlement is the moment money and shares actually change hands: on T+1, members pay in by 11:00 am, money goes out at 1:30 pm and shares land in buyers' demat accounts by 3:30 pm. When a seller fails to deliver, the CC buys the shares in an auction or, failing that, closes out the deal at a penalty price. Derivatives settle daily through MTM and finally at expiry, in cash for indices and by delivery for stocks. When a company gives a bonus, split, rights or big dividend, F&O contracts are adjusted so nobody gains or loses from the event itself.","exam_focus":["The T+1 clock: 7:30 am confirmation, 9:00 am obligations, 11:00 am pay-in, 1:30 pm funds pay-out, 3:30 pm direct securities pay-out; derivatives T+1 (currency T+2)","NEW: closing price is VWAP of the last 30 minutes now; the Closing Auction Session runs 3:15 pm to 3:35 pm in four 5-minute parts, with a random close, starting with F&O stocks","Funds rules: no cash, USCNBA/DSCNBA, running account conditions (30/90 days, 30 working days, 1 or 3 working days, 30 calendar days), 0.07% per day penal interest","Auction and close-out: timings, once only, within one week, Auction+1 settlement, 20% vs 10% close-out rules, Core SGF","Derivatives settlement: MTM, final settlement prices, exercise values, what long/short calls and puts turn into","Corporate actions: ex-date = record date under T+1, adjustment factors for bonus/split/rights, 2% dividend test, merger/demerger conditions"],"sections":[{"id":"6.1","title":"Introduction: Settlement Cycles and the T+1 Day","blocks":[{"type":"p","text":"Settlement once took a week; today <b>all cash market trades settle on T+1<\/b>: Monday's trades on Tuesday. A settlement cycle is the period within which settlement happens; when counting it, <b>holidays are skipped<\/b>: bank holidays, exchange/CC holidays, Saturdays and Sundays. An <b>optional beta T+0<\/b> cycle runs alongside T+1."},{"type":"compare","items":[{"title":"Cash settlement (derivatives)","points":["Only the price difference is paid","No underlying delivered","Index futures and options"]},{"title":"Physical settlement (derivatives)","points":["The actual underlying security is delivered","Stock futures and options"]}]},{"type":"key","text":"Derivatives: daily and final settlement on <b>T+1 working day<\/b>, except final settlement of <b>currency derivatives on T+2<\/b>. Funds for daily MTM, cash-settled futures final settlement, premium and cash-settled options exercise move before market opens next day, <b>around 8:30 am<\/b>."},{"type":"table","head":["Day","Time","Activity (cash market, T+1)"],"rows":[["T","","Trade day"],["T+1","By 7:30 am","Custodial confirmation of trades to CC"],["T+1","By 9:00 am","CC completes processing and downloads obligation files to brokers/custodians"],["T+1","Up to 11:00 am","Pay-in of securities and funds"],["T+1","After pay-in","Valuation debit for securities not delivered"],["T+1","1:30 pm","Pay-out of funds"],["T+1","By 3:30 pm","Pay-out of securities, direct to client demat"],["T+1","Afternoon (6.5.1)","Auction session for T-day shortages"],["T+2","Generally by 8:00 am","Auction pay-in, followed by auction pay-out"]],"caption":"Typical T+1 activity schedule"},{"type":"p","text":"<b>Direct pay-out<\/b> (SEBI, <b>June 5, 2024<\/b>): CCs credit securities straight to the client's demat. Pay-out time moved from <b>1:30 pm to 3:30 pm<\/b>, but clients get shares the <b>same settlement day<\/b> instead of a day later. Not for clients of SEBI-registered custodians."}]},{"id":"6.1.1","title":"Settlement when there are Holidays","blocks":[{"type":"list","items":["After holidays, several settlements may fall due together. CCs settle them <b>sequentially<\/b>: the first settlement's pay-in and pay-out finish before the next pay-in starts.","Pay-out from the first settlement can be used for pay-in of the next.","Depositories complete <b>inter-depository transfers within one hour<\/b>, before the next pay-in.","A strict schedule ensures all settlements finish the <b>same day<\/b>."]}]},{"id":"6.2","title":"Determination of Settlement Obligations","blocks":[{"type":"p","text":"The CC takes trade and price data from the exchange and computes obligations by the method set for each segment/product."},{"type":"compare","items":[{"title":"Netted obligation","points":["Buys and sells netted","Deliver only if sells exceed buys; receive if buys exceed sells","Funds also netted"]},{"title":"Trade-to-trade (gross)","points":["No netting","Securities pay-in = cumulative <b>sell<\/b> qty; pay-out = cumulative <b>buy<\/b> qty","Funds pay-in = cumulative buy value; pay-out = cumulative sell value"]}]},{"type":"example","title":"Buy 300, sell 200","text":"Netted: receive 100 shares. Gross: deliver 200 and receive 300, paying the full buy value and receiving the full sell value."}]},{"id":"6.2.1","title":"Closing Price and the new Closing Auction Session","blocks":[{"type":"new","text":"<b>Today:<\/b> a stock's closing price in the equity cash segment is the <b>Volume Weighted Average Price (VWAP)<\/b> of trades in the <b>last 30 minutes<\/b> of the Continuous Trading Session (CTS)."},{"type":"new","text":"<b>Coming in:<\/b> SEBI's circular dated <b>January 16, 2026<\/b> introduces a <b>Closing Auction Session (CAS)<\/b> in the equity cash segment (with some changes to the pre-open auction session). It is phased in: <b>first, stocks on which derivative contracts are available<\/b> get their closing price from CAS."},{"type":"new","text":"CAS is a separate <b>20-minute<\/b> session, <b>3:15 pm to 3:35 pm<\/b>, on all trading days, in four 5-minute sub-sessions."},{"type":"table","head":["Sub-session","Starts","Duration","What happens"],"rows":[["1","3:15 pm","5 mins","Reference price calculation; transition from CTS to CAS"],["2","3:20 pm","5 mins","Order entry: <b>both limit and market<\/b> orders"],["3","3:25 pm","5 mins","Order entry for <b>limit orders<\/b> only; market orders cannot be modified/cancelled; <b>random close in the last 2 minutes<\/b>"],["4","3:30 pm","5 mins","Order matching"]],"caption":"Closing Auction Session (NEW)"},{"type":"p","text":"The random close stops anyone from timing a last-second order to nudge the price. Getting the close right matters because so much rests on it."},{"type":"new","text":"<b>Importance of the closing price.<\/b> It is the basis for: (1) the post-close session, (2) next day's <b>base price<\/b>, (3) next day's morning <b>block deal window<\/b>, (4) end-of-day <b>index value<\/b>, (5) <b>settlement of derivatives<\/b> contracts, (6) <b>mark-to-market margin<\/b>, (7) <b>mutual fund NAV<\/b>."},{"type":"hook","text":"CAS in four 5-minute beats: <b>Set<\/b> (3:15 reference price), <b>Enter all<\/b> (3:20), <b>Enter limits, random stop<\/b> (3:25), <b>Match<\/b> (3:30), done by 3:35."},{"type":"trap","text":"Today's method is VWAP of the last <b>30<\/b> minutes, not the last traded price. CAS lasts <b>20<\/b> minutes, and the random close is in the last <b>2<\/b> minutes of the third sub-session."}]},{"id":"6.3","title":"Settlement of Funds","blocks":[{"type":"p","text":"Every clearing member keeps a <b>separate and distinct primary clearing account<\/b> with a designated clearing bank, <b>one per segment<\/b>. Payers need clear funds by the stipulated pay-in time; banks debit/credit on CC instructions. Deposit in any form; withdraw only in self-name."}]},{"id":"6.3.1","title":"Mode of Payment and Running Account Settlement","blocks":[{"type":"p","text":"<b>No cash<\/b>, either way: not against obligations, not as margin, not against sales. Only <b>account payee crossed cheque, demand draft, direct credit (NEFT etc.) or other RBI-approved modes<\/b>, with cheques drawn by and issued to the client only. Members keep an <b>audit trail<\/b> showing electronic transfers and pre-funded instruments (pay order, DD, banker's cheque) came from the client's own bank account."},{"type":"table","head":["Account","Use"],"rows":[["Up Streaming Client Nodal Bank Account (USCNBA)","<b>Receive<\/b> client funds: \"Name of the SB/CM - USCNB account\""],["Down Streaming Client Nodal Bank Account (DSCNBA)","<b>Pay<\/b> clients, only from here: \"Name of the SB/CM - DSCNB account\""],["Settlement account","\"Name of Stock Broker - Settlement Account\""]],"caption":"Renamed by SEBI circular of December 13, 2023 (earlier \"Name of Stock Broker - Client Account\")"},{"type":"hook","text":"<b>Up<\/b>stream: money comes up from the client. <b>Down<\/b>stream: money goes down to the client."},{"type":"key","text":"Default: client funds settled <b>within 24 hours / 1 working day of pay-out<\/b>, unless the client authorises a <b>running account<\/b>, now for <b>funds only<\/b> (securities running account discontinued, SEBI circular June 20, 2019)."},{"type":"table","head":["Running account rule","Detail"],"rows":[["Authorisation","Dated, revocable at any time, signed by the <b>client only<\/b> (not an AP or PoA holder)"],["Frequency","Monthly or quarterly per client choice: at least once in <b>30 / 90 days<\/b>, on EOD obligation across all exchanges"],["Dates","<b>First Friday and/or Saturday<\/b> of the month/quarter, per the annual calendar exchanges jointly issue at the start of the financial year"],["Statement","Funds ledger and securities register extracts; disputes within <b>30 working days<\/b>"],["Intimation","SMS and email once settled"],["Retention","Funds for outstanding obligations may be retained as SEBI/exchanges specify"],["Payment mode","Electronic; physical instrument only if electronic payment fails"],["On client request","Within <b>1 working day<\/b> if with broker; <b>3 working days<\/b> if with CM/CC"],["Inactive client","No trade in <b>30 calendar days<\/b>: entire credit balance returned on the next <b>monthly<\/b> settlement date, whatever the preference (unless he trades before it)"],["Other clients","No inter-client adjustment; funds from a settled client stay in the USCNBA"],["Not needed for","MTF funds/securities; BG/FDR collateral; institutional clients settling via custodians"]]},{"type":"list","items":["An <b>Authorised Person<\/b> may not accept client funds or securities, and trades proprietarily only with his own money.","SEBI (June 2025) mandated validated, exclusive <b>UPI IDs<\/b> for SEBI-registered intermediaries collecting investor funds."]},{"type":"trap","text":"Dispute window: <b>30 working days<\/b>. Inactivity trigger: <b>30 calendar days<\/b>. The inactive client is paid on the <b>monthly<\/b> date even if he chose quarterly."}]},{"id":"6.3.3","title":"Settlement Dues","blocks":[{"type":"p","text":"CMs and custodians pay the clearing agency what they owe for each settlement, and the agency pays them what is due, based on exchange/clearing agency data."}]},{"id":"6.3.4","title":"Funds Shortages","blocks":[{"type":"p","text":"Missing a funds obligation (including STT/stamp duty, Capital Cushion and valuation debits) can mean withdrawal of trading facility and disciplinary action."},{"type":"list","items":["Trading facility withdrawn and <b>securities pay-out withheld<\/b> if the shortfall exceeds the SEBI/CC limit, or shortages recur within a set period and amount.","Penal interest of <b>not less than 0.07% per day<\/b> on the shortage.","If the defaulter never brings the funds within the allowed time, the CC may <b>close out securities<\/b> in the normal or auction market."]},{"type":"example","title":"Cost of being short","text":"Short by ₹10,00,000 at pay-in: penal interest of at least ₹700 per day."}]},{"id":"6.4","title":"Settlement of Securities","blocks":[{"type":"p","text":"Demat deliveries go directly to/from clients' <b>beneficiary accounts<\/b> (except to entities under approved schemes). With direct pay-out, buyers get shares on settlement day <b>by 3:30 pm<\/b>."},{"type":"list","items":["<b>Seller:<\/b> on learning of execution, gives a <b>delivery (debit) instruction<\/b> to his DP to move shares to the broker's pool account, or lets the broker do it under <b>DDPI<\/b>.","<b>Buyer:<\/b> a one-time <b>standing instruction<\/b> to the DP (at opening or later), or a receipt instruction for each purchase.","Block mechanism and pay-in validation apply (5.6.2, 5.6.3)."]}]},{"id":"6.4.1","title":"Settlement through the Depository Clearing System","blocks":[{"type":"p","text":"Securities pay-in is on T+0 and/or T+1 by cycle. Members keep settlement (pool) accounts with <b>both NSDL and CDSL<\/b>, mandatory <b>even if pay-out is taken in a preferred depository<\/b>. TMs clearing through another CM also need TM pool accounts in both."},{"type":"compare","items":[{"title":"Settlement number","points":["Unique ID for trades of one settlement cycle","Links trades to their settlement date for reconciliation"]},{"title":"Settlement / market type","points":["Normal, auction, limited physical etc.","Decides rules and timeline: demat/physical, gross or trade-for-trade","CCs publish both periodically"]}]},{"type":"table","head":["#","Demat account category","Purpose"],"rows":[["1","Proprietary Account","Own securities"],["2","Pool Account","Settlement"],["3","Client Unpaid Securities Pledgee Account","Pledge of clients' unpaid securities"],["4","Client Securities Margin Pledge Account","Margin by pledge/re-pledge"],["5","Client Securities under Funding Account","Margin-funded securities"],["6","Client Nodal MFOS Account","MFOS unit subscription/redemption"]],"caption":"The only 6 demat account categories SEBI allows brokers"},{"type":"p","text":"<b>Physical settlement of F&O<\/b> (SEBI, November 30, 2022): obligations are <b>netted with Capital Market obligations of the same trade date<\/b> where CM-TM-client (UCC) and security match, and settled in the <b>CM segment's<\/b>
