      "<div><b>100</b><span>questions, 1 mark each</span></div><div><b>2 hrs</b><span>about 72 seconds a question</span></div><div><b>50</b><span>marks to pass (50%)</span></div><div><b>&minus;0.25</b><span>for every wrong answer</span></div></div>" +
      '<p class="small">This guide holds ' + totQ + " practice questions, " + totF + " flashcards and " + totN + " must-know numbers.</p></section>" +
      '<section class="block"><h2>Where the marks are</h2><p>Chapters 3 to 6 carry 65 of the 100 marks. Spend your time there.</p><div class="wbars" role="list">' + bars + '</div><p class="small">Exam weightage by chapter, from the workbook\'s syllabus outline. Out of 100 questions, a chapter\'s weightage is roughly its number of questions.</p></section>' +
      '<section class="block"><h2>A 7-day plan</h2><p class="small">About 90 minutes a day. Tick days off as you go; this browser remembers them.</p><ol class="plan">' + plan + "</ol></section>" +
      '<section class="block"><h2>How to beat the negative marking</h2><div class="tips">' +
      '<div class="tip-card"><h3>Answer what you can narrow down</h3><p>A wrong answer costs a quarter mark, a right one earns a full mark. Once you can rule out even one option, guessing pays.</p><div class="calc">Rule out 1 of 4: &#8531; &times; 1 &minus; &#8532; &times; 0.25 = +0.17<br>Rule out 2 of 4: &frac12; &times; 1 &minus; &frac12; &times; 0.25 = +0.38<br>Blind guess: &frac14; &times; 1 &minus; &frac34; &times; 0.25 = +0.06</div></div>' +
      '<div class="tip-card"><h3>Two passes, not one</h3><p>First pass: answer everything you know in about 70 minutes and mark the rest. Second pass: work the marked ones by elimination. Never spend three minutes on one question.</p></div>' +
      '<div class="tip-card"><h3>Numbers are free marks</h3><p>Many questions are a straight recall of a timeline, a percentage or a day-count. The numbers cheat sheet is the fastest revision in this guide.</p></div>' +
      '<div class="tip-card"><h3>Read the last line first</h3><p>Words like <b>not</b>, <b>except</b>, <b>maximum</b> and <b>within</b> flip the answer. Underline them in your head before you look at the options.</p></div>' +
      "</div></section>" +
      '<div class="btns"><a class="btn primary" href="#ch1">Start with Chapter 1</a><a class="btn" href="#mock">Try a full mock first</a></div>' +
      "</div>";
  }

  /* ---------- chapter ---------- */
  function viewChapter(id) {
    const c = byId[id];
    const prev = byId[id - 1], next = byId[id + 1];
    const toc = c.sections.map(s => '<button data-jump="' + secDom(c.id, s.id) + '"><span class="sid">' + s.id + "</span>" + s.title + "</button>").join("");
    const secs = c.sections.map(s => '<section class="sec" id="' + secDom(c.id, s.id) + '"><h2><span class="sid">' + s.id + "</span>" + s.title + "</h2>" + s.blocks.map(blockHTML).join("") + "</section>").join("");
    return '<article class="page">' +
      '<header class="ch-head"><div class="eyebrow">Chapter ' + c.id + " of 8 · " + c.weight + "% of the paper · about " + c.minutes + " min read</div><h1>" + c.title + '</h1><p class="lead">' + c.big_picture + "</p></header>" +
      '<section class="focus"><h2 class="h-sm">What the exam asks from this chapter</h2><ul>' + c.exam_focus.map(x => "<li>" + x + "</li>").join("") + "</ul></section>" +

      secs +
      '<section class="sec" id="nums-' + c.id + '"><h2><span class="sid">#</span>Numbers to memorise</h2><p class="small">Every figure from this chapter in one place. Cover the right column and test yourself.</p>' + numbersTable(c.numbers, true) + "</section>" +
      '<div class="endbar"><label class="check"><input type="checkbox" id="read-' + c.id + '" data-read="' + c.id + '"' + (S.read[c.id] ? " checked" : "") + "> I've read this chapter</label>" +
      '<div class="btns"><a class="btn primary" href="#quiz-' + c.id + '">Practice quiz · ' + c.questions.length + ' questions</a><a class="btn" href="#cards-' + c.id + '">Flashcards · ' + c.flashcards.length + "</a></div></div>" +
      '<div class="pn">' + (prev ? '<a href="#ch' + prev.id + '">&larr; Chapter ' + prev.id + ": " + prev.short + "</a>" : "<span></span>") + (next ? '<a href="#ch' + next.id + '">Chapter ' + next.id + ": " + next.short + " &rarr;</a>" : '<a href="#mock">Take the full mock &rarr;</a>') + "</div>" +
      "</article>";
  }

  /* ---------- flashcards ---------- */
  let deck = null;
  function buildDeck(key) {
    let cards = [];
    if (key === "numbers") CH.forEach(c => c.numbers.forEach(n => cards.push({ q: n.fact, a: n.value, ch: c.id, kind: "Number" })));
    else if (key === "all") CH.forEach(c => c.flashcards.forEach(f => cards.push({ q: f.q, a: f.a, ch: c.id, kind: "Card" })));
    else if (byId[+key]) byId[+key].flashcards.forEach(f => cards.push({ q: f.q, a: f.a, ch: +key, kind: "Card" }));
    return { key: key, cards: cards, queue: shuffle(cards.map((_, i) => i)), known: 0, flipped: false };
  }
  function viewCards(key) {
    if (!deck || deck.key !== key) deck = buildDeck(key);
    const chips = '<a class="chip' + (key === "all" ? " on" : "") + '" href="#cards">All chapters</a>' +
      CH.map(c => '<a class="chip' + (String(key) === String(c.id) ? " on" : "") + '" href="#cards-' + c.id + '">Ch ' + c.id + "</a>").join("") +
      '<a class="chip' + (key === "numbers" ? " on" : "") + '" href="#cards-numbers">Numbers only</a>';
    return '<div class="page"><div class="eyebrow">Revise</div><h1>Flashcards</h1><p class="lead">Say the answer out loud before you flip. Cards you miss come back at the end of the pile.</p>' +
      '<div class="chips">' + chips + '</div><div id="fcwrap"></div>' +
      '<p class="kbd"><kbd>Space</kbd> flip &nbsp; <kbd>&rarr;</kbd> got it &nbsp; <kbd>&larr;</kbd> again</p></div>';
  }
  function drawCard() {
    const w = $("#fcwrap"); if (!w || !deck) return;
    if (!deck.cards.length) { w.innerHTML = '<div class="empty">No cards in this deck yet.</div>'; return; }
    if (!deck.queue.length) {
      w.innerHTML = '<div class="qcard"><div class="verdict-big ok">Deck cleared.</div><p>You went through all ' + deck.cards.length + ' cards. Run it again tomorrow; spaced repeats are what make it stick.</p><div class="btns"><button class="btn primary" data-act="fc-restart">Shuffle and restart</button><a class="btn" href="#quiz-mixed">Mixed practice quiz</a></div></div>';
      return;
    }
    const card = deck.cards[deck.queue[0]];
    w.innerHTML = '<div class="fc-stage"><div class="fc' + (deck.flipped ? " flipped" : "") + '" id="fc" data-act="fc-flip" role="button" tabindex="0" aria-label="Flip card">' +
      '<div class="face front"><div class="lbl"><span>' + (card.kind === "Number" ? "What's the number?" : "Question") + "</span><span>Chapter " + card.ch + '</span></div><div class="txt">' + card.q + "</div></div>" +
      '<div class="face back"><div class="lbl"><span>Answer</span><span>Chapter ' + card.ch + '</span></div><div class="txt">' + card.a + "</div></div></div></div>" +
      '<div class="fc-bar"><span class="fc-count">' + deck.queue.length + " left · " + deck.known + " known · " + deck.cards.length + ' total</span><div class="btns"><button class="btn" data-act="fc-again">Again</button><button class="btn ghost" data-act="fc-flip">Flip</button><button class="btn primary" data-act="fc-got">Got it</button></div></div>';
  }
  function fcFlip() { deck.flipped = !deck.flipped; const el = $("#fc"); if (el) el.classList.toggle("flipped", deck.flipped); }
  function fcNext(got) {
    const i = deck.queue.shift();
    if (got) deck.known++; else deck.queue.push(i);
    deck.flipped = false; drawCard();
  }

  /* ---------- quiz ---------- */
  let quiz = null;
  function poolFor(arg) {
    if (arg === "mixed") return ALLQ.map(q => q.qid);
    if (arg === "mistakes") return S.wrong.filter(id => QBY[id]);
    return byId[arg] ? byId[arg].questions.map((_, i) => arg + ":" + i) : [];
  }
  function viewQuiz(arg) {
    if (quiz && quiz.arg === arg && quiz.ids) return quizScreen();
    quiz = { arg: arg };
    const pool = poolFor(arg);
    const c = byId[arg];
    const title = c ? "Chapter " + c.id + " practice" : arg === "mixed" ? "Mixed practice" : "My mistakes";
    const lead = c ? c.title + ". Instant feedback after every answer, with the reason." :
      arg === "mixed" ? "Questions from every chapter, shuffled. Good for the last few days." :
      "Every question you have got wrong, in quizzes or mocks. Answer one right and it leaves this list.";
    const chWrong = c ? S.wrong.filter(id => id.startsWith(c.id + ":")).length : 0;
    let opts = "";
    if (!pool.length) {
      opts = '<div class="empty">' + (arg === "mistakes" ? "No mistakes recorded yet. Take a chapter quiz or a mock, and anything you miss shows up here." : "No questions here yet.") + "</div>";
    } else {
      opts = '<div class="start-grid">' +
        '<button class="start" data-act="quiz-go" data-n="10"><b>Quick round</b><span>10 random questions</span></button>' +
        (arg === "mixed" ? '<button class="start" data-act="quiz-go" data-n="25"><b>Long round</b><span>25 random questions</span></button>' :
          '<button class="start" data-act="quiz-go" data-n="all"><b>Full set</b><span>All ' + pool.length + " questions</span></button>") +
        (c && chWrong ? '<button class="start" data-act="quiz-go" data-n="wrong"><b>My mistakes here</b><span>' + chWrong + " to retry</span></button>" : "") +
        "</div>";
    }
    const best = c && S.best[c.id] != null ? '<p class="small">Your best score on this chapter: <b>' + S.best[c.id] + "%</b>. Aim for 80% before moving on.</p>" : (c ? '<p class="small">Aim for 80% before moving on.</p>' : "");
    return '<div class="page"><div class="eyebrow">Test yourself</div><h1>' + title + '</h1><p class="lead">' + lead + "</p>" + opts + best +
      (c ? '<p><a href="#ch' + c.id + '">&larr; Back to the chapter</a></p>' : "") + "</div>";
  }
  function startQuiz(n) {
    let pool = poolFor(quiz.arg);
    if (n === "wrong") pool = S.wrong.filter(id => id.startsWith(quiz.arg + ":"));
    pool = shuffle(pool);
    if (n !== "all" && n !== "wrong") pool = pool.slice(0, +n);
    quiz.ids = pool; quiz.i = 0; quiz.ans = {}; quiz.full = (n === "all");
    $("#view").innerHTML = quizScreen(); window.scrollTo(0, 0);
  }
  function quizScreen() {
    if (quiz.i >= quiz.ids.length) return quizResult();
    const q = QBY[quiz.ids[quiz.i]];
    const picked = quiz.ans[q.qid];
    const done = picked != null;
    const opts = q.options.map((o, i) => {
      let cls = "opt";
      if (done) { if (i === q.answer) cls += " right"; else if (i === picked) cls += " wrong"; }
      return '<button class="' + cls + '" data-act="quiz-pick" data-i="' + i + '"' + (done ? " disabled" : "") + '><span class="L">' + LET[i] + "</span><span>" + o + "</span></button>";
    }).join("");
    const exp = done ? '<div class="explain"><span class="verdict ' + (picked === q.answer ? "ok" : "no") + '">' + (picked === q.answer ? "Correct." : "Not quite. The answer is " + LET[q.answer] + ".") + "</span>" + q.why + '<span class="ref">Chapter ' + q.ch + (q.ref ? " · section " + q.ref : "") + "</span></div>" : "";
    return '<div class="page"><div class="eyebrow">' + (byId[quiz.arg] ? "Chapter " + quiz.arg + " practice" : quiz.arg === "mixed" ? "Mixed practice" : "My mistakes") + "</div>" +
      '<div class="progressline" style="margin-top:14px"><i style="width:' + (quiz.i / quiz.ids.length * 100) + '%"></i></div>' +
      '<div class="qcard"><div class="qmeta"><span>Question ' + (quiz.i + 1) + " of " + quiz.ids.length + "</span><span>Chapter " + q.ch + (q.ref ? " · " + q.ref : "") + "</span><span>" + q.level + '</span></div><div class="qtext">' + q.q + '</div><div class="opts">' + opts + "</div>" + exp +
      '<div class="qfoot"><span class="small">' + Object.values(quiz.ans).length + " answered · " + quiz.ids.filter(id => quiz.ans[id] != null && quiz.ans[id] === QBY[id].answer).length + ' correct</span><div class="btns"><button class="btn ghost" data-act="quiz-quit">End quiz</button>' +
      (done ? '<button class="btn primary" data-act="quiz-next" id="qnext">' + (quiz.i + 1 === quiz.ids.length ? "See score" : "Next") + "</button>" : "") + "</div></div></div>" +
      '<p class="kbd"><kbd>1</kbd>&ndash;<kbd>4</kbd> pick &nbsp; <kbd>Enter</kbd> next</p></div>';
  }
  function quizPick(i) {
    const q = QBY[quiz.ids[quiz.i]];
    if (quiz.ans[q.qid] != null || i >= q.options.length) return;
    quiz.ans[q.qid] = i;
    markWrong(q.qid, i !== q.answer);
    $("#view").innerHTML = quizScreen();
    renderNav();
    const nb = $("#qnext"); if (nb) nb.focus({ preventScroll: true });
  }
  function quizResult() {
    const answered = quiz.ids.filter(id => quiz.ans[id] != null);
    const right = answered.filter(id => quiz.ans[id] === QBY[id].answer).length;
    if (!answered.length) { const a = quiz.arg; quiz = null; return viewQuiz(a); }
    const p = pct(right, answered.length);
    const c = byId[quiz.arg];
    if (c && answered.length >= 10) { S.best[c.id] = Math.max(S.best[c.id] || 0, p); save("best"); renderNav(); }
    const missed = answered.filter(id => quiz.ans[id] !== QBY[id].answer);
    const rv = missed.map(id => { const q = QBY[id]; return '<div class="rv"><div class="q">' + q.q + '</div><div class="a"><span class="y">Your answer: ' + q.options[quiz.ans[id]] + '</span><span class="c">Correct: ' + q.options[q.answer] + '</span></div><div class="why">' + q.why + "</div></div>"; }).join("");
    const again = quiz.arg;
    quiz.ids = null;
    return '<div class="page"><div class="eyebrow">Result</div><h1>' + right + " out of " + answered.length + "</h1>" +
      '<div class="verdict-big ' + (p >= 70 ? "ok" : "no") + '">' + (p >= 80 ? "Exam-ready on this set." : p >= 60 ? "Close. Reread the sections behind the misses below." : "Go back to the chapter, then try again.") + "</div>" +
      '<div class="score"><div><b>' + p + '%</b><span>score</span></div><div><b>' + right + '</b><span>correct</span></div><div><b>' + missed.length + "</b><span>to review</span></div></div>" +
      '<div class="btns"><a class="btn primary" href="#quiz-' + again + '" data-act="quiz-reset">Another round</a>' + (c ? '<a class="btn" href="#ch' + c.id + '">Back to chapter ' + c.id + "</a>" : "") + (missed.length ? '<a class="btn" href="#quiz-mistakes">All my mistakes</a>' : "") + "</div>" +
      (missed.length ? '<h2 style="margin-top:32px">What you missed</h2><div class="review">' + rv + "</div>" : "") + "</div>";
  }

  /* ---------- mock ---------- */
  let timerHandle = null;
  const MOCK_SECS = 7200;
  function buildMock() {
    const seen = new Set(S.mockSeen);
    let picks = [], rest = [], deficit = 0;
    CH.forEach(c => {
      const ids = c.questions.map((_, i) => c.id + ":" + i);
      const pool = shuffle(ids.filter(id => !seen.has(id))).concat(shuffle(ids.filter(id => seen.has(id))));
      const n = Math.min(c.weight, pool.length);
      picks = picks.concat(pool.slice(0, n)); rest = rest.concat(pool.slice(n)); deficit += c.weight - n;
    });
    if (deficit > 0) picks = picks.concat(shuffle(rest).slice(0, deficit));
    const all = new Set(S.mockSeen.concat(picks));
    S.mockSeen = all.size >= ALLQ.length ? [] : Array.from(all); save("mockSeen");
    return shuffle(picks);
  }
  function mockLeft() { return MOCK_SECS - (Date.now() - S.mock.start) / 1000; }
  function viewMock() {
    const m = S.mock;
    if (m && m.done) return mockResult();
    if (m && !m.done) { if (mockLeft() <= 0) { submitMock(); return mockResult(); } return mockScreen(); }
    return '<div class="page"><div class="eyebrow">Test yourself</div><h1>Full mock test</h1><p class="lead">Exactly like the real paper: 100 questions drawn by chapter weightage, a 2-hour clock and negative marking. No feedback until you submit.</p>' +
      '<ul class="rules"><li>100 questions, 1 mark each. A wrong answer costs 0.25. A blank costs nothing.</li><li>Pass mark: 50. Aim for 70 or more here before the real exam.</li><li>The clock keeps running if you leave this page, as it would in the exam hall.</li><li>Each new mock prefers questions you have not seen in an earlier mock.</li></ul>' +
      '<div class="btns"><button class="btn primary" data-act="mock-start">Start the 2-hour mock</button></div></div>';
  }
  function mockScreen() {
    const m = S.mock;
    const q = QBY[m.ids[m.i]];
    const pick = m.ans[m.i];
    const opts = q.options.map((o, i) => '<button class="opt' + (pick === i ? " sel" : "") + '" data-act="mock-pick" data-i="' + i + '"><span class="L">' + LET[i] + "</span><span>" + o + "</span></button>").join("");
    const answered = Object.keys(m.ans).length;
    const grid = m.ids.map((_, i) => '<button data-act="mock-go" data-i="' + i + '" class="' + (m.ans[i] != null ? "ans " : "") + (m.mk[i] ? "mk " : "") + (i === m.i ? "cur" : "") + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + "</button>").join("");
    return '<div class="page"><div class="mockbar"><span class="timer" id="timer">' + fmtTime(mockLeft()) + '</span><span class="stat">' + answered + " of 100 answered</span><button class=\"btn\" data-act=\"mock-submit\">Submit</button></div>" +
      '<div id="confirmbox"></div>' +
      '<div class="qcard"><div class="qmeta"><span>Question ' + (m.i + 1) + " of " + m.ids.length + '</span></div><div class="qtext">' + q.q + '</div><div class="opts">' + opts + "</div>" +
      '<div class="qfoot"><div class="btns"><button class="btn ghost" data-act="mock-clear"' + (pick == null ? " disabled" : "") + '>Clear answer</button><button class="btn ghost" data-act="mock-mark">' + (m.mk[m.i] ? "Unmark" : "Mark for review") + "</button></div>" +
      '<div class="btns"><button class="btn" data-act="mock-prev"' + (m.i === 0 ? " disabled" : "") + '>Previous</button><button class="btn primary" data-act="mock-next"' + (m.i === m.ids.length - 1 ? " disabled" : "") + ">Next</button></div></div></div>" +
      '<div class="grid100">' + grid + '</div><div class="legend"><span><i class="ans"></i>answered</span><span><i class="mk"></i>marked for review</span><span><i></i>not answered</span></div></div>';
  }
  function startTimer() {
    if (!S.mock || S.mock.done) return;
    timerHandle = setInterval(() => {
      const t = $("#timer"); const left = mockLeft();
      if (left <= 0) { clearInterval(timerHandle); submitMock(); render(); return; }
      if (t) { t.textContent = fmtTime(left); t.classList.toggle("low", left < 600); }
    }, 1000);
  }
  function submitMock() {
    const m = S.mock; if (!m || m.done) return;
    m.done = true; m.end = Math.min(Date.now(), m.start + MOCK_SECS * 1000);
    m.ids.forEach((id, i) => { if (m.ans[i] != null) markWrong(id, m.ans[i] !== QBY[id].answer); });
    save("mock"); renderNav();
  }
  function mockResult() {
    const m = S.mock;
    let right = 0, wrong = 0, blank = 0; const per = {};
    CH.forEach(c => { per[c.id] = { n: 0, r: 0, w: 0 }; });
    m.ids.forEach((id, i) => {
      const q = QBY[id]; const p = per[q.ch]; p.n++;
      if (m.ans[i] == null) blank++; else if (m.ans[i] === q.answer) { right++; p.r++; } else { wrong++; p.w++; }
    });
    const net = right - wrong * 0.25;
    const pass = net >= 50;
    const used = Math.round((m.end - m.start) / 60000);
    const rows = CH.map(c => { const p = per[c.id]; const nn = p.r - p.w * 0.25; return "<tr><td>" + c.id + ". " + c.short + "</td><td>" + p.n + "</td><td>" + p.r + "</td><td>" + p.w + "</td><td>" + nn.toFixed(2) + "</td><td>" + (p.n ? pct(p.r, p.n) + "%" : "&ndash;") + "</td></tr>"; }).join("");
    const filter = m.filter || "wrong";
    const list = m.ids.map((id, i) => ({ id, i, q: QBY[id] })).filter(x => filter === "all" ? true : filter === "blank" ? m.ans[x.i] == null : (m.ans[x.i] != null && m.ans[x.i] !== x.q.answer));
    const rv = list.map(x => { const a = m.ans[x.i]; return '<div class="rv"><div class="qmeta"><span>Q' + (x.i + 1) + "</span><span>Chapter " + x.q.ch + (x.q.ref ? " · " + x.q.ref : "") + '</span></div><div class="q">' + x.q.q + '</div><div class="a"><span class="y' + (a === x.q.answer ? " ok" : "") + '">Your answer: ' + (a == null ? "left blank" : x.q.options[a]) + "</span>" + (a !== x.q.answer ? '<span class="c">Correct: ' + x.q.options[x.q.answer] + "</span>" : "") + '</div><div class="why">' + x.q.why + "</div></div>"; }).join("");
    return '<div class="page"><div class="eyebrow">Mock test result</div><h1>' + (Number.isInteger(net) ? net : net.toFixed(2)) + " out of 100</h1>" +
      '<div class="verdict-big ' + (pass ? "ok" : "no") + '">' + (pass ? (net >= 70 ? "Pass, with a safe margin." : "Pass, but the margin is thin. Aim for 70.") : "Below the pass mark of 50. Use the chapter table to see where the marks went.") + "</div>" +
      '<div class="score"><div><b>' + right + '</b><span>correct (+' + right + ')</span></div><div><b>' + wrong + '</b><span>wrong (&minus;' + (wrong * 0.25).toFixed(2) + ')</span></div><div><b>' + blank + '</b><span>left blank · ' + used + " min used</span></div></div>" +
      '<h2>By chapter</h2><div class="scroll"><table><thead><tr><th>Chapter</th><th>Qs</th><th>Right</th><th>Wrong</th><th>Net</th><th>Accuracy</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="btns" style="margin:24px 0"><button class="btn primary" data-act="mock-new">Start a new mock</button><a class="btn" href="#quiz-mistakes">Drill my mistakes</a></div>' +
      '<h2>Review</h2><div class="chips">' + [["wrong", "Wrong answers"], ["blank", "Left blank"], ["all", "All 100"]].map(f => '<button class="chip' + (filter === f[0] ? " on" : "") + '" data-act="mock-filter" data-f="' + f[0] + '">' + f[1] + "</button>").join("") + "</div>" +
      '<div class="review">' + (rv || '<div class="empty">Nothing in this list.</div>') + "</div></div>";
  }

  /* ---------- numbers ---------- */
  function viewNumbers() {
    const total = CH.reduce((s, c) => s + c.numbers.length, 0);
    return '<div class="page"><div class="eyebrow">Revise</div><h1>Numbers cheat sheet</h1><p class="lead">All ' + total + ' timelines, limits, percentages and day-counts from the workbook. Read it the night before and again the morning of the exam.</p>' +
      '<input class="search" id="numsearch" type="search" placeholder="Filter, e.g. margin, 30 days, T+1, SCORES" aria-label="Filter numbers">' +
      '<p><a href="#cards-numbers">Drill these as flashcards &rarr;</a></p>' +
      CH.map(c => '<section class="numgroup" data-g="' + c.id + '"><h3><a href="#ch' + c.id + '"><span class="no">' + c.id + "</span>" + c.title + "</a></h3>" + numbersTable(c.numbers, true) + "</section>").join("") +
      '<div class="empty" id="nonum" hidden>Nothing matches that filter.</div></div>';
  }
  function filterNumbers(term) {
    term = term.trim().toLowerCase(); let any = false;
    document.querySelectorAll(".numgroup").forEach(g => {
      let vis = 0;
      g.querySelectorAll("tbody tr").forEach(tr => { const ok = !term || tr.dataset.s.includes(term); tr.hidden = !ok; if (ok) vis++; });
      g.hidden = vis === 0; if (vis) any = true;
    });
    $("#nonum").hidden = any;
  }

  /* ---------- updates ---------- */
  function viewUpdates() {
    const items = [];
    CH.forEach(c => c.sections.forEach(s => s.blocks.forEach(b => { if (b.type === "new") items.push({ c, s, b }); })));
    return '<div class="page"><div class="eyebrow">Revise</div><h1>Updated in July 2026</h1><p class="lead">The workbook highlights these passages in yellow as new. Fresh material is a favourite for fresh questions, so know each one cold.</p>' +
      (items.length ? items.map(x => '<div class="upd"><div class="where">Chapter ' + x.c.id + " · " + x.s.id + " " + x.s.title + ' · <a href="#ch' + x.c.id + '" data-goto="' + secDom(x.c.id, x.s.id) + '">read in context</a></div>' + blockHTML(Object.assign({}, x.b, { type: "p" })) + "</div>").join("") : '<div class="empty">No updates flagged.</div>') +
      "</div>";
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act],[data-jump],[data-goto],[data-plan],[data-read]");
    if (!t) return;
    if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
    if (t.dataset.goto) { pendingJump = t.dataset.goto; return; }
    const act = t.dataset.act;
    if (!act) return;
    if (act === "fc-flip") fcFlip();
    else if (act === "fc-got") fcNext(true);
    else if (act === "fc-again") fcNext(false);
    else if (act === "fc-restart") { deck = buildDeck(deck.key); drawCard(); }
    else if (act === "quiz-go") startQuiz(t.dataset.n);
    else if (act === "quiz-pick") quizPick(+t.dataset.i);
    else if (act === "quiz-next") { quiz.i++; $("#view").innerHTML = quizScreen(); window.scrollTo(0, 0); }
    else if (act === "quiz-quit") { quiz.ids = quiz.ids.slice(0, quiz.i + (quiz.ans[quiz.ids[quiz.i]] != null ? 1 : 0)); quiz.i = quiz.ids.length; $("#view").innerHTML = quizScreen(); window.scrollTo(0, 0); }
    else if (act === "quiz-reset") { quiz = null; if (location.hash === t.getAttribute("href")) { e.preventDefault(); render(); } }
    else if (act === "mock-start" || act === "mock-new") { S.mock = { ids: buildMock(), ans: {}, mk: {}, i: 0, start: Date.now(), done: false }; save("mock"); renderNav(); render(); window.scrollTo(0, 0); }
    else if (act === "mock-pick") { S.mock.ans[S.mock.i] = +t.dataset.i; save("mock"); rerenderMock(); }
    else if (act === "mock-clear") { delete S.mock.ans[S.mock.i]; save("mock"); rerenderMock(); }
    else if (act === "mock-mark") { S.mock.mk[S.mock.i] = !S.mock.mk[S.mock.i]; save("mock"); rerenderMock(); }
    else if (act === "mock-prev") { S.mock.i = Math.max(0, S.mock.i - 1); save("mock"); rerenderMock(true); }
    else if (act === "mock-next") { S.mock.i = Math.min(S.mock.ids.length - 1, S.mock.i + 1); save("mock"); rerenderMock(true); }
    else if (act === "mock-go") { S.mock.i = +t.dataset.i; save("mock"); rerenderMock(true); }
    else if (act === "mock-submit") {
      const blanks = 100 - Object.keys(S.mock.ans).length; const marked = Object.values(S.mock.mk).filter(Boolean).length;
      $("#confirmbox").innerHTML = '<div class="confirm"><div>' + (blanks ? "<b>" + blanks + " questions are unanswered.</b> " : "") + (marked ? marked + " are marked for review. " : "") + 'Once you submit, the answers are final.</div><div class="btns"><button class="btn primary" data-act="mock-confirm">Submit and see my score</button><button class="btn" data-act="mock-cancel">Keep going</button></div></div>';
    }
    else if (act === "mock-cancel") { $("#confirmbox").innerHTML = ""; }
    else if (act === "mock-confirm") { clearInterval(timerHandle); submitMock(); render(); window.scrollTo(0, 0); }
    else if (act === "mock-filter") { S.mock.filter = t.dataset.f; save("mock"); $("#view").innerHTML = mockResult(); }
  });
  let pendingJump = null;
  function rerenderMock(top) {
    $("#view").innerHTML = mockScreen();
    if (top) { const bar = $(".mockbar"); if (bar && bar.getBoundingClientRect().top < 0) window.scrollTo(0, 0); }
  }
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.plan != null) { S.plan[t.dataset.plan] = t.checked; save("plan"); t.closest("li").classList.toggle("done", t.checked); }
    if (t.dataset.read != null) { S.read[t.dataset.read] = t.checked; save("read"); renderNav(); }
  });
  document.addEventListener("input", e => { if (e.target.id === "numsearch") filterNumbers(e.target.value); });
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const r = currentRoute();
    if (r.view === "cards" && deck && deck.queue.length) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); fcFlip(); }
      else if (e.key === "ArrowRight") fcNext(true);
      else if (e.key === "ArrowLeft") fcNext(false);
    } else if (r.view === "quiz" && quiz && quiz.ids && quiz.i < quiz.ids.length) {
      const k = e.key.toLowerCase(); const idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
      if (idx >= 0) quizPick(idx);
      else if (e.key === "Enter" && quiz.ans[quiz.ids[quiz.i]] != null && e.target.id !== "qnext") { quiz.i++; $("#view").innerHTML = quizScreen(); window.scrollTo(0, 0); }
    } else if (r.view === "mock" && S.mock && !S.mock.done) {
      const k = e.key.toLowerCase(); const idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
      const q = QBY[S.mock.ids[S.mock.i]];
      if (idx >= 0 && idx < q.options.length) { S.mock.ans[S.mock.i] = idx; save("mock"); rerenderMock(); }
      else if (e.key === "ArrowRight" && S.mock.i < S.mock.ids.length - 1) { S.mock.i++; save("mock"); rerenderMock(true); }
      else if (e.key === "ArrowLeft" && S.mock.i > 0) { S.mock.i--; save("mock"); rerenderMock(true); }
    }
  });
  $("#menuBtn").addEventListener("click", () => {
    const open = !$("#rail").classList.contains("open");
    $("#rail").classList.toggle("open", open);
    $("#menuBtn").setAttribute("aria-expanded", String(open));
  });
  window.addEventListener("hashchange", () => {
    if (currentRoute().view === "quiz" && quiz && !quiz.ids) quiz = null;
    render();
    if (pendingJump) { const el = document.getElementById(pendingJump); pendingJump = null; if (el) el.scrollIntoView(); }
  });
  renderNav();
  render();
})();
</script>

</body></html>
