<!doctype html>

<head>

<!-- Served by Cloudflare Pages for any unknown address, at any depth, so asset paths are absolute. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Same palette and type as the course list. */
:root {
  --bg: #f6f8f7; --ink: #14211c; --ink-2: #3a4943; --muted: #62736b; --line: #d6e0db; --accent: #0a6a4c; --accent-ink: #ffffff; --surface: #ffffff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d1311; --ink: #e3ebe7; --ink-2: #c2cec8; --muted: #8fa199; --line: #2a3732; --accent: #4cc497; --accent-ink: #05241a; --surface: #141c19; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0d1311; --ink: #e3ebe7; --ink-2: #c2cec8; --muted: #8fa199; --line: #2a3732; --accent: #4cc497; --accent-ink: #05241a; --surface: #141c19; color-scheme: dark; }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.6; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 72px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: clamp(36px, 7vw, 56px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 10px 0 16px; text-wrap: balance; }
p { color: var(--ink-2); margin: 0 0 28px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">404 &middot; Page not found</div>
  <h1>There's nothing at this address.</h1>
  <p>The link may have a typo, or the page may have moved. Your saved progress is safe; it lives in your browser, not on this page.</p>
  <div class="btns"><a class="btn primary" href="/">All courses</a><a class="btn" href="/nism-vii/">NISM VII study guide</a></div>
</main>
</body>
</html>
